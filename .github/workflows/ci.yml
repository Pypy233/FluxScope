name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install
        run: python -m pip install -e ".[server,llm,test]"
      # viewer, reports for the corpus, replayed LLM evaluation (no model is called), all tests;
      # the browser tests use the Chrome that GitHub's Ubuntu runners provide
      - name: Rebuild and test
        run: PY=python bash scripts/build_all.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            dist/
            eval/results/
