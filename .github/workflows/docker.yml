# Builds the FluxScope image, smoke-tests it (scripts/docker_smoke.sh) and pushes it to
# ghcr.io/pypy233/fluxscope for linux/amd64 and linux/arm64 (Apple Silicon).
name: docker
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fluxscope
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha
      - name: Build (amd64, for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fluxscope:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (offline analyses and the server inside the image)
        run: bash scripts/docker_smoke.sh fluxscope:ci
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
