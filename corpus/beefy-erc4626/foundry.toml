# Minimal build configuration for the pinned FluxScope snapshot of beefy-contracts.
# Upstream: https://github.com/beefyfinance/beefy-contracts @ e33f868e2d995c2db9219029c26d31cd8e7d5cb2
[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.23"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable-4.9.6/",
    "@openzeppelin-5/contracts/=lib/openzeppelin-contracts-5.4.0/",
]
