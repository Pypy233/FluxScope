          // Shift in bits from prod1 into prod0.\n            prod0 |= prod1 * twos;\n\n            // Invert denominator mod 2^256. Now that denominator is an odd number, it has an inverse modulo 2^256 such\n            // that denominator * inv = 1 mod 2^256. Compute the inverse by starting with a seed that is correct for\n            // four bits. That is, denominator * inv = 1 mod 2^4.\n            uint256 inverse = (3 * denominator) ^ 2;\n\n            // Use the Newton-Raphson iteration to improve the precision. Thanks to Hensel's lifting lemma, this also\n            // works in modular arithmetic, doubling the correct bits in each step.\n            inverse *= 2 - denominator * inverse; // inverse mod 2^8\n            inverse *= 2 - denominator * inverse; // inverse mod 2^16\n            inverse *= 2 - denominator * inverse; // inverse mod 2^32\n            inverse *= 2 - denominator * inverse; // inverse mod 2^64\n            inverse *= 2 - denominator * inverse; // inverse mod 2^128\n            inverse *= 2 - denominator * inverse; // inverse mod 2^256\n\n            // Because the division is now exact we can divide by multiplying with the modular inverse of denominator.\n            // This will give us the correct result modulo 2^256. Since the preconditions guarantee that the outcome is\n            // less than 2^256, this is the final result. We don't need to compute the high bits of the result and prod1\n            // is no longer required.\n            result = prod0 * inverse;\n            return result;\n        }\n    }\n\n    /**\n     * @notice Calculates x * y / denominator with full precision, following the selected rounding direction.\n     */\n    function mulDiv(uint256 x, uint256 y, uint256 denominator, Rounding rounding) internal pure returns (uint256) {\n        uint256 result = mulDiv(x, y, denominator);\n        if (unsignedRoundsUp(rounding) && mulmod(x, y, denominator) > 0) {\n            result += 1;\n        }\n        return result;\n    }\n\n    /**\n     * @dev Returns the square root of a number. If the number is not a perfect square, the value is rounded\n     * towards zero.\n     *\n     * Inspired by Henry S. Warren, Jr.'s \"Hacker's Delight\" (Chapter 11).\n     */\n    function sqrt(uint256 a) internal pure returns (uint256) {\n        if (a == 0) {\n            return 0;\n        }\n\n        // For our first guess, we get the biggest power of 2 which is smaller than the square root of the target.\n        //\n        // We know that the \"msb\" (most significant bit) of our target number `a` is a power of 2 such that we have\n        // `msb(a) \u003c= a \u003c 2*msb(a)`. This value can be written `msb(a)=2**k` with `k=log2(a)`.\n        //\n        // This can be rewritten `2**log2(a) \u003c= a \u003c 2**(log2(a) + 1)`\n        // → `sqrt(2**k) \u003c= sqrt(a) \u003c sqrt(2**(k+1))`\n        // → `2**(k/2) \u003c= sqrt(a) \u003c 2**((k+1)/2) \u003c= 2**(k/2 + 1)`\n        //\n        // Consequently, `2**(log2(a) / 2)` is a good first approximation of `sqrt(a)` with at least 1 correct bit.\n        uint256 result = 1 \u003c\u003c (log2(a) >> 1);\n\n        // At this point `result` is an estimation with one bit of precision. We know the true value is a uint128,\n        // since it is the square root of a uint256. Newton's method converges quadratically (precision doubles at\n        // every iteration). We thus need at most 7 iteration to turn our partial result with one bit of precision\n        // into the expected uint128 result.\n        unchecked {\n            result = (result + a / result) >> 1;\n            result = (result + a / result) >> 1;\n            result = (result + a / result) >> 1;\n            result = (result + a / result) >> 1;\n            result = (result + a / result) >> 1;\n            result = (result + a / result) >> 1;\n            result = (result + a / result) >> 1;\n            return min(result, a / result);\n        }\n    }\n\n    /**\n     * @notice Calculates sqrt(a), following the selected rounding direction.\n     */\n    function sqrt(uint256 a, Rounding rounding) internal pure returns (uint256) {\n        unchecked {\n            uint256 result = sqrt(a);\n            return result + (unsignedRoundsUp(rounding) && result * result \u003c a ? 1 : 0);\n        }\n    }\n\n    /**\n     * @dev Return the log in base 2 of a positive value rounded towards zero.\n     * Returns 0 if given 0.\n     */\n    function log2(uint256 value) internal pure returns (uint256) {\n        uint256 result = 0;\n        unchecked {\n            if (value >> 128 > 0) {\n                value >>= 128;\n                result += 128;\n            }\n            if (value >> 64 > 0) {\n                value >>= 64;\n                result += 64;\n            }\n            if (value >> 32 > 0) {\n                value >>= 32;\n                result += 32;\n            }\n            if (value >> 16 > 0) {\n                value >>= 16;\n                result += 16;\n            }\n            if (value >> 8 > 0) {\n                value >>= 8;\n                result += 8;\n            }\n            if (value >> 4 > 0) {\n                value >>= 4;\n                result += 4;\n            }\n            if (value >> 2 > 0) {\n                value >>= 2;\n                result += 2;\n            }\n            if (value >> 1 > 0) {\n                result += 1;\n            }\n        }\n        return result;\n    }\n\n    /**\n     * @dev Return the log in base 2, following the selected rounding direction, of a positive value.\n     * Returns 0 if given 0.\n     */\n    function log2(uint256 value, Rounding rounding) internal pure returns (uint256) {\n        unchecked {\n            uint256 result = log2(value);\n            return result + (unsignedRoundsUp(rounding) && 1 \u003c\u003c result \u003c value ? 1 : 0);\n        }\n    }\n\n    /**\n     * @dev Return the log in base 10 of a positive value rounded towards zero.\n     * Returns 0 if given 0.\n     */\n    function log10(uint256 value) internal pure returns (uint256) {\n        uint256 result = 0;\n        unchecked {\n            if (value >= 10 ** 64) {\n                value /= 10 ** 64;\n                result += 64;\n            }\n            if (value >= 10 ** 32) {\n                value /= 10 ** 32;\n                result += 32;\n            }\n            if (value >= 10 ** 16) {\n                value /= 10 ** 16;\n                result += 16;\n            }\n            if (value >= 10 ** 8) {\n                value /= 10 ** 8;\n                result += 8;\n            }\n            if (value >= 10 ** 4) {\n                value /= 10 ** 4;\n                result += 4;\n            }\n            if (value >= 10 ** 2) {\n                value /= 10 ** 2;\n                result += 2;\n            }\n            if (value >= 10 ** 1) {\n                result += 1;\n            }\n        }\n        return result;\n    }\n\n    /**\n     * @dev Return the log in base 10, following the selected rounding direction, of a positive value.\n     * Returns 0 if given 0.\n     */\n    function log10(uint256 value, Rounding rounding) internal pure returns (uint256) {\n        unchecked {\n            uint256 result = log10(value);\n            return result + (unsignedRoundsUp(rounding) && 10 ** result \u003c value ? 1 : 0);\n        }\n    }\n\n    /**\n     * @dev Return the log in base 256 of a positive value rounded towards zero.\n     * Returns 0 if given 0.\n     *\n     * Adding one to the result gives the number of pairs of hex symbols needed to represent `value` as a hex string.\n     */\n    function log256(uint256 value) internal pure returns (uint256) {\n        uint256 result = 0;\n        unchecked {\n            if (value >> 128 > 0) {\n                value >>= 128;\n                result += 16;\n            }\n            if (value >> 64 > 0) {\n                value >>= 64;\n                result += 8;\n            }\n            if (value >> 32 > 0) {\n                value >>= 32;\n                result += 4;\n            }\n            if (value >> 16 > 0) {\n                value >>= 16;\n                result += 2;\n            }\n            if (value >> 8 > 0) {\n                result += 1;\n            }\n        }\n        return result;\n    }\n\n    /**\n     * @dev Return the log in base 256, following the selected rounding direction, of a positive value.\n     * Returns 0 if given 0.\n     */\n    function log256(uint256 value, Rounding rounding) internal pure returns (uint256) {\n        unchecked {\n            uint256 result = log256(value);\n            return result + (unsignedRoundsUp(rounding) && 1 \u003c\u003c (result \u003c\u003c 3) \u003c value ? 1 : 0);\n        }\n    }\n\n    /**\n     * @dev Returns whether a provided rounding mode is considered rounding up for unsigned integers.\n     */\n    function unsignedRoundsUp(Rounding rounding) internal pure returns (bool) {\n        return uint8(rounding) % 2 == 1;\n    }\n}\n"},{"path":"src/MetaMorpho.sol","sha256":"8ca12df64bd6971d2969f6f4848d30e42efc634d084fcc29ccacaa93e1fdf0f5","language":"solidity","synthetic":false,"content":"// SPDX-License-Identifier: GPL-2.0-or-later\npragma solidity 0.8.21;\n\nimport {\n    MarketConfig,\n    PendingUint192,\n    PendingAddress,\n    MarketAllocation,\n    IMetaMorphoBase,\n    IMetaMorphoStaticTyping\n} from \"./interfaces/IMetaMorpho.sol\";\nimport {Id, MarketParams, Market, IMorpho} from \"../lib/morpho-blue/src/interfaces/IMorpho.sol\";\n\nimport {PendingUint192, PendingAddress, PendingLib} from \"./libraries/PendingLib.sol\";\nimport {ConstantsLib} from \"./libraries/ConstantsLib.sol\";\nimport {ErrorsLib} from \"./libraries/ErrorsLib.sol\";\nimport {EventsLib} from \"./libraries/EventsLib.sol\";\nimport {WAD} from \"../lib/morpho-blue/src/libraries/MathLib.sol\";\nimport {UtilsLib} from \"../lib/morpho-blue/src/libraries/UtilsLib.sol\";\nimport {SafeCast} from \"../lib/openzeppelin-contracts/contracts/utils/math/SafeCast.sol\";\nimport {SharesMathLib} from \"../lib/morpho-blue/src/libraries/SharesMathLib.sol\";\nimport {MorphoLib} from \"../lib/morpho-blue/src/libraries/periphery/MorphoLib.sol\";\nimport {MarketParamsLib} from \"../lib/morpho-blue/src/libraries/MarketParamsLib.sol\";\nimport {IERC20Metadata} from \"../lib/openzeppelin-contracts/contracts/token/ERC20/extensions/IERC20Metadata.sol\";\nimport {MorphoBalancesLib} from \"../lib/morpho-blue/src/libraries/periphery/MorphoBalancesLib.sol\";\n\nimport {Multicall} from \"../lib/openzeppelin-contracts/contracts/utils/Multicall.sol\";\nimport {Ownable2Step, Ownable} from \"../lib/openzeppelin-contracts/contracts/access/Ownable2Step.sol\";\nimport {ERC20Permit} from \"../lib/openzeppelin-contracts/contracts/token/ERC20/extensions/ERC20Permit.sol\";\nimport {\n    IERC20,\n    IERC4626,\n    ERC20,\n    ERC4626,\n    Math,\n    SafeERC20\n} from \"../lib/openzeppelin-contracts/contracts/token/ERC20/extensions/ERC4626.sol\";\n\n/// @title MetaMorpho\n/// @author Morpho Labs\n/// @custom:contact security@morpho.org\n/// @notice ERC4626 compliant vault allowing users to deposit assets to Morpho.\ncontract MetaMorpho is ERC4626, ERC20Permit, Ownable2Step, Multicall, IMetaMorphoStaticTyping {\n    using Math for uint256;\n    using UtilsLib for uint256;\n    using SafeCast for uint256;\n    using SafeERC20 for IERC20;\n    using MorphoLib for IMorpho;\n    using SharesMathLib for uint256;\n    using MorphoBalancesLib for IMorpho;\n    using MarketParamsLib for MarketParams;\n    using PendingLib for MarketConfig;\n    using PendingLib for PendingUint192;\n    using PendingLib for PendingAddress;\n\n    /* IMMUTABLES */\n\n    /// @inheritdoc IMetaMorphoBase\n    IMorpho public immutable MORPHO;\n\n    /// @notice OpenZeppelin decimals offset used by the ERC4626 implementation.\n    /// @dev Calculated to be max(0, 18 - underlyingDecimals) at construction, so the initial conversion rate maximizes\n    /// precision between shares and assets.\n    uint8 public immutable DECIMALS_OFFSET;\n\n    /* STORAGE */\n\n    /// @inheritdoc IMetaMorphoBase\n    address public curator;\n\n    /// @inheritdoc IMetaMorphoBase\n    mapping(address => bool) public isAllocator;\n\n    /// @inheritdoc IMetaMorphoBase\n    address public guardian;\n\n    /// @inheritdoc IMetaMorphoStaticTyping\n    mapping(Id => MarketConfig) public config;\n\n    /// @inheritdoc IMetaMorphoBase\n    uint256 public timelock;\n\n    /// @inheritdoc IMetaMorphoStaticTyping\n    PendingAddress public pendingGuardian;\n\n    /// @inheritdoc IMetaMorphoStaticTyping\n    mapping(Id => PendingUint192) public pendingCap;\n\n    /// @inheritdoc IMetaMorphoStaticTyping\n    PendingUint192 public pendingTimelock;\n\n    /// @inheritdoc IMetaMorphoBase\n    uint96 public fee;\n\n    /// @inheritdoc IMetaMorphoBase\n    address public feeRecipient;\n\n    /// @inheritdoc IMetaMorphoBase\n    address public skimRecipient;\n\n    /// @inheritdoc IMetaMorphoBase\n    Id[] public supplyQueue;\n\n    /// @inheritdoc IMetaMorphoBase\n    Id[] public withdrawQueue;\n\n    /// @inheritdoc IMetaMorphoBase\n    uint256 public lastTotalAssets;\n\n    /* CONSTRUCTOR */\n\n    /// @dev Initializes the contract.\n    /// @param owner The owner of the contract.\n    /// @param morpho The address of the Morpho contract.\n    /// @param initialTimelock The initial timelock.\n    /// @param _asset The address of the underlying asset.\n    /// @param _name The name of the vault.\n    /// @param _symbol The symbol of the vault.\n    constructor(\n        address owner,\n        address morpho,\n        uint256 initialTimelock,\n        address _asset,\n        string memory _name,\n        string memory _symbol\n    ) ERC4626(IERC20(_asset)) ERC20Permit(_name) ERC20(_name, _symbol) Ownable(owner) {\n        if (morpho == address(0)) revert ErrorsLib.ZeroAddress();\n\n        MORPHO = IMorpho(morpho);\n        DECIMALS_OFFSET = uint8(uint256(18).zeroFloorSub(IERC20Metadata(_asset).decimals()));\n\n        _checkTimelockBounds(initialTimelock);\n        _setTimelock(initialTimelock);\n\n        IERC20(_asset).forceApprove(morpho, type(uint256).max);\n    }\n\n    /* MODIFIERS */\n\n    /// @dev Reverts if the caller doesn't have the curator role.\n    modifier onlyCuratorRole() {\n        address sender = _msgSender();\n        if (sender != curator && sender != owner()) revert ErrorsLib.NotCuratorRole();\n\n        _;\n    }\n\n    /// @dev Reverts if the caller doesn't have the allocator role.\n    modifier onlyAllocatorRole() {\n        address sender = _msgSender();\n        if (!isAllocator[sender] && sender != curator && sender != owner()) {\n            revert ErrorsLib.NotAllocatorRole();\n        }\n\n        _;\n    }\n\n    /// @dev Reverts if the caller doesn't have the guardian role.\n    modifier onlyGuardianRole() {\n        if (_msgSender() != owner() && _msgSender() != guardian) revert ErrorsLib.NotGuardianRole();\n\n        _;\n    }\n\n    /// @dev Reverts if the caller doesn't have the curator nor the guardian role.\n    modifier onlyCuratorOrGuardianRole() {\n        if (_msgSender() != guardian && _msgSender() != curator && _msgSender() != owner()) {\n            revert ErrorsLib.NotCuratorNorGuardianRole();\n        }\n\n        _;\n    }\n\n    /// @dev Makes sure conditions are met to accept a pending value.\n    /// @dev Reverts if:\n    /// - there's no pending value;\n    /// - the timelock has not elapsed since the pending value has been submitted.\n    modifier afterTimelock(uint256 validAt) {\n        if (validAt == 0) revert ErrorsLib.NoPendingValue();\n        if (block.timestamp \u003c validAt) revert ErrorsLib.TimelockNotElapsed();\n\n        _;\n    }\n\n    /* ONLY OWNER FUNCTIONS */\n\n    /// @inheritdoc IMetaMorphoBase\n    function setCurator(address newCurator) external onlyOwner {\n        if (newCurator == curator) revert ErrorsLib.AlreadySet();\n\n        curator = newCurator;\n\n        emit EventsLib.SetCurator(newCurator);\n    }\n\n    /// @inheritdoc IMetaMorphoBase\n    function setIsAllocator(address newAllocator, bool newIsAllocator) external onlyOwner {\n        if (isAllocator[newAllocator] == newIsAllocator) revert ErrorsLib.AlreadySet();\n\n        isAllocator[newAllocator] = newIsAllocator;\n\n        emit EventsLib.SetIsAllocator(newAllocator, newIsAllocator);\n    }\n\n    /// @inheritdoc IMetaMorphoBase\n    function setSkimRecipient(address newSkimRecipient) external onlyOwner {\n        if (newSkimRecipient == skimRecipient) revert ErrorsLib.AlreadySet();\n\n        skimRecipient = newSkimRecipient;\n\n        emit EventsLib.SetSkimRecipient(newSkimRecipient);\n    }\n\n    /// @inheritdoc IMetaMorphoBase\n    function submitTimelock(uint256 newTimelock) external onlyOwner {\n        if (newTimelock == timelock) revert ErrorsLib.AlreadySet();\n        if (pendingTimelock.validAt != 0) revert ErrorsLib.AlreadyPending();\n        _checkTimelockBounds(newTimelock);\n\n        if (newTimelock > timelock) {\n            _setTimelock(newTimelock);\n        } else {\n            // Safe \"unchecked\" cast because newTimelock \u003c= MAX_TIMELOCK.\n            pendingTimelock.update(uint184(newTimelock), timelock);\n\n            emit EventsLib.SubmitTimelock(newTimelock);\n        }\n    }\n\n    /// @inheritdoc IMetaMorphoBase\n    function setFee(uint256 newFee) external onlyOwner {\n        if (newFee == fee) revert ErrorsLib.AlreadySet();\n        if (newFee > ConstantsLib.MAX_FEE) revert ErrorsLib.MaxFeeExceeded();\n        if (newFee != 0 && feeRecipient == address(0)) revert ErrorsLib.ZeroFeeRecipient();\n\n        // Accrue fee using the previous fee set before changing it.\n        _updateLastTotalAssets(_accrueFee());\n\n        // Safe \"unchecked\" cast because newFee \u003c= MAX_FEE.\n        fee = uint96(newFee);\n\n        emit EventsLib.SetFee(_msgSender(), fee);\n    }\n\n    /// @inheritdoc IMetaMorphoBase\n    function setFeeRecipient(address newFeeRecipient) external onlyOwner {\n        if (newFeeRecipient == feeRecipient) revert ErrorsLib.AlreadySet();\n        if (newFeeRecipient == address(0) && fee != 0) revert ErrorsLib.ZeroFeeRecipient();\n\n        // Accrue fee to the previous fee recipient set before changing it.\n        _updateLastTotalAssets(_accrueFee());\n\n        feeRecipient = newFeeRecipient;\n\n        emit EventsLib.SetFeeRecipient(newFeeRecipient);\n    }\n\n    /// @inheritdoc IMetaMorphoBase\n    function submitGuardian(address newGuardian) external onlyOwner {\n        if (newGuardian == guardian) revert ErrorsLib.AlreadySet();\n        if (pendingGuardian.validAt != 0) revert ErrorsLib.AlreadyPending();\n\n        if (guardian == address(0)) {\n            _setGuardian(newGuardian);\n        } else {\n            pendingGuardian.update(newGuardian, timelock);\n\n            emit EventsLib.SubmitGuardian(newGuardian);\n        }\n    }\n\n    /* ONLY CURATOR FUNCTIONS */\n\n    /// @inheritdoc IMetaMorphoBase\n    function submitCap(MarketParams memory marketParams, uint256 newSupplyCap) external onlyCuratorRole {\n        Id id = marketParams.id();\n        if (marketParams.loanToken != asset()) revert ErrorsLib.InconsistentAsset(id);\n        if (MORPHO.lastUpdate(id) == 0) revert ErrorsLib.MarketNotCreated();\n        if (pendingCap[id].validAt != 0) revert ErrorsLib.AlreadyPending();\n        if (config[id].removableAt != 0) revert ErrorsLib.PendingRemoval();\n        uint256 supplyCap = config[id].cap;\n        if (newSupplyCap == supplyCap) revert ErrorsLib.AlreadySet();\n\n        if (newSupplyCap \u003c supplyCap) {\n            _setCap(marketParams, id, newSupplyCap.toUint184());\n        } else {\n            pendingCap[id].update(newSupplyCap.toUint184(), timelock);\n\n            emit EventsLib.SubmitCap(_msgSender(), id, newSupplyCap);\n        }\n    }\n\n    /// @inheritdoc IMetaMorphoBase\n    function submitMarketRemoval(MarketParams memory marketParams) external onlyCuratorRole {\n        Id id = marketParams.id();\n        if (config[id].removableAt != 0) revert ErrorsLib.AlreadyPending();\n        if (config[id].cap != 0) revert ErrorsLib.NonZeroCap();\n        if (!config[id].enabled) revert ErrorsLib.MarketNotEnabled(id);\n        if (pendingCap[id].validAt != 0) revert ErrorsLib.PendingCap(id);\n\n        // Safe \"unchecked\" cast because timelock \u003c= MAX_TIMELOCK.\n        config[id].removableAt = uint64(block.timestamp + timelock);\n\n        emit EventsLib.SubmitMarketRemoval(_msgSender(), id);\n    }\n\n    /* ONLY ALLOCATOR FUNCTIONS */\n\n    /// @inheritdoc IMetaMorphoBase\n    function setSupplyQueue(Id[] calldata newSupplyQueue) external onlyAllocatorRole {\n        uint256 length = newSupplyQueue.length;\n\n        if (length > ConstantsLib.MAX_QUEUE_LENGTH) revert ErrorsLib.MaxQueueLengthExceeded();\n\n        for (uint256 i; i \u003c length; ++i) {\n            if (config[newSupplyQueue[i]].cap == 0) revert ErrorsLib.UnauthorizedMarket(newSupplyQueue[i]);\n        }\n\n        supplyQueue = newSupplyQueue;\n\n        emit EventsLib.SetSupplyQueue(_msgSender(), newSupplyQueue);\n    }\n\n    /// @inheritdoc IMetaMorphoBase\n    function updateWithdrawQueue(uint256[] calldata indexes) external onlyAllocatorRole {\n        uint256 newLength = indexes.length;\n        uint256 currLength = withdrawQueue.length;\n\n        bool[] memory seen = new bool[](currLength);\n        Id[] memory newWithdrawQueue = new Id[](newLength);\n\n        for (uint256 i; i \u003c newLength; ++i) {\n            uint256 prevIndex = indexes[i];\n\n            // If prevIndex >= currLength, it will revert with native \"Index out of bounds\".\n            Id id = withdrawQueue[prevIndex];\n            if (seen[prevIndex]) revert ErrorsLib.DuplicateMarket(id);\n            seen[prevIndex] = true;\n\n            newWithdrawQueue[i] = id;\n        }\n\n        for (uint256 i; i \u003c currLength; ++i) {\n            if (!seen[i]) {\n                Id id = withdrawQueue[i];\n\n                if (config[id].cap != 0) revert ErrorsLib.InvalidMarketRemovalNonZeroCap(id);\n                if (pendingCap[id].validAt != 0) revert ErrorsLib.PendingCap(id);\n\n                if (MORPHO.supplyShares(id, address(this)) != 0) {\n                    if (config[id].removableAt == 0) revert ErrorsLib.InvalidMarketRemovalNonZeroSupply(id);\n\n                    if (block.timestamp \u003c config[id].removableAt) {\n                        revert ErrorsLib.InvalidMarketRemovalTimelockNotElapsed(id);\n                    }\n                }\n\n                delete config[id];\n            }\n        }\n\n        withdrawQueue = newWithdrawQueue;\n\n        emit EventsLib.SetWithdrawQueue(_msgSender(), newWithdrawQueue);\n    }\n\n    /// @inheritdoc IMetaMorphoBase\n    function reallocate(MarketAllocation[] calldata allocations) external onlyAllocatorRole {\n        uint256 totalSupplied;\n        uint256 totalWithdrawn;\n        for (uint256 i; i \u003c allocations.length; ++i) {\n            MarketAllocation memory allocation = allocations[i];\n            Id id = allocation.marketParams.id();\n\n            (uint256 supplyAssets, uint256 supplyShares,) = _accruedSupplyBalance(allocation.marketParams, id);\n            uint256 withdrawn = supplyAssets.zeroFloorSub(allocation.assets);\n\n            if (withdrawn > 0) {\n                if (!config[id].enabled) revert ErrorsLib.MarketNotEnabled(id);\n\n                // Guarantees that unknown frontrunning donations can be withdrawn, in order to disable a market.\n                uint256 shares;\n                if (allocation.assets == 0) {\n                    shares = supplyShares;\n                    withdrawn = 0;\n                }\n\n                (uint256 withdrawnAssets, uint256 withdrawnShares) =\n                    MORPHO.withdraw(allocation.marketParams, withdrawn, shares, address(this), address(this));\n\n                emit EventsLib.ReallocateWithdraw(_msgSender(), id, withdrawnAssets, withdrawnShares);\n\n                totalWithdrawn += withdrawnAssets;\n            } else {\n                uint256 suppliedAssets = allocation.assets == type(uint256).max\n                    ? totalWithdrawn.zeroFloorSub(totalSupplied)\n                    : allocation.assets.zeroFloorSub(supplyAssets);\n\n                if (suppliedAssets == 0) continue;\n\n                uint256 supplyCap = config[id].cap;\n                if (supplyCap == 0) revert ErrorsLib.UnauthorizedMarket(id);\n\n                if (supplyAssets + suppliedAssets > supplyCap) revert ErrorsLib.SupplyCapExceeded(id);\n\n                // The market's loan asset is guaranteed to be the vault's asset because it has a non-zero supply cap.\n                (, uint256 suppliedShares) =\n                    MORPHO.supply(allocation.marketParams, suppliedAssets, 0, address(this), hex\"\");\n\n                emit EventsLib.ReallocateSupply(_msgSender(), id, suppliedAssets, suppliedShares);\n\n                totalSupplied += suppliedAssets;\n            }\n        }\n\n        if (totalWithdrawn != totalSupplied) revert ErrorsLib.InconsistentReallocation();\n    }\n\n    /* REVOKE FUNCTIONS */\n\n    /// @inheritdoc IMetaMorphoBase\n    function revokePendingTimelock() external onlyGuardianRole {\n        delete pendingTimelock;\n\n        emit EventsLib.RevokePendingTimelock(_msgSender());\n    }\n\n    /// @inheritdoc IMetaMorphoBase\n    function revokePendingGuardian() external onlyGuardianRole {\n        delete pendingGuardian;\n\n        emit EventsLib.RevokePendingGuardian(_msgSender());\n    }\n\n    /// @inheritdoc IMetaMorphoBase\n    function revokePendingCap(Id id) external onlyCuratorOrGuardianRole {\n        delete pendingCap[id];\n\n        emit EventsLib.RevokePendingCap(_msgSender(), id);\n    }\n\n    /// @inheritdoc IMetaMorphoBase\n    function revokePendingMarketRemoval(Id id) external onlyCuratorOrGuardianRole {\n        delete config[id].removableAt;\n\n        emit EventsLib.RevokePendingMarketRemoval(_msgSender(), id);\n    }\n\n    /* EXTERNAL */\n\n    /// @inheritdoc IMetaMorphoBase\n    function supplyQueueLength() external view returns (uint256) {\n        return supplyQueue.length;\n    }\n\n    /// @inheritdoc IMetaMorphoBase\n    function withdrawQueueLength() external view returns (uint256) {\n        return withdrawQueue.length;\n    }\n\n    /// @inheritdoc IMetaMorphoBase\n    function acceptTimelock() external afterTimelock(pendingTimelock.validAt) {\n        _setTimelock(pendingTimelock.value);\n    }\n\n    /// @inheritdoc IMetaMorphoBase\n    function acceptGuardian() external afterTimelock(pendingGuardian.validAt) {\n        _setGuardian(pendingGuardian.value);\n    }\n\n    /// @inheritdoc IMetaMorphoBase\n    function acceptCap(MarketParams memory marketParams)\n        external\n        afterTimelock(pendingCap[marketParams.id()].validAt)\n    {\n        Id id = marketParams.id();\n\n        // Safe \"unchecked\" cast because pendingCap \u003c= type(uint184).max.\n        _setCap(marketParams, id, uint184(pendingCap[id].value));\n    }\n\n    /// @inheritdoc IMetaMorphoBase\n    function skim(address token) external {\n        if (skimRecipient == address(0)) revert ErrorsLib.ZeroAddress();\n\n        uint256 amount = IERC20(token).balanceOf(address(this));\n\n        IERC20(token).safeTransfer(skimRecipient, amount);\n\n        emit EventsLib.Skim(_msgSender(), token, amount);\n    }\n\n    /* ERC4626 (PUBLIC) */\n\n    /// @inheritdoc IERC20Metadata\n    function decimals() public view override(ERC20, ERC4626) returns (uint8) {\n        return ERC4626.decimals();\n    }\n\n    /// @inheritdoc IERC4626\n    /// @dev Warning: May be higher than the actual max deposit due to duplicate markets in the supplyQueue.\n    function maxDeposit(address) public view override returns (uint256) {\n        return _maxDeposit();\n    }\n\n    /// @inheritdoc IERC4626\n    /// @dev Warning: May be higher than the actual max mint due to duplicate markets in the supplyQueue.\n    function maxMint(address) public view override returns (uint256) {\n        uint256 suppliable = _maxDeposit();\n\n        return _convertToShares(suppliable, Math.Rounding.Floor);\n    }\n\n    /// @inheritdoc IERC4626\n    /// @dev Warning: May be lower than the actual amount of assets that can be withdrawn by `owner` due to conversion\n    /// roundings between shares and assets.\n    function maxWithdraw(address owner) public view override returns (uint256 assets) {\n        (assets,,) = _maxWithdraw(owner);\n    }\n\n    /// @inheritdoc IERC4626\n    /// @dev Warning: May be lower than the actual amount of shares that can be redeemed by `owner` due to conversion\n    /// roundings between shares and assets.\n    function maxRedeem(address owner) public view override returns (uint256) {\n        (uint256 assets, uint256 newTotalSupply, uint256 newTotalAssets) = _maxWithdraw(owner);\n\n        return _convertToSharesWithTotals(assets, newTotalSupply, newTotalAssets, Math.Rounding.Floor);\n    }\n\n    /// @inheritdoc IERC4626\n    function deposit(uint256 assets, address receiver) public override returns (uint256 shares) {\n        uint256 newTotalAssets = _accrueFee();\n\n        // Update `lastTotalAssets` to avoid an inconsistent state in a re-entrant context.\n        // It is updated again in `_deposit`.\n        lastTotalAssets = newTotalAssets;\n\n        shares = _convertToSharesWithTotals(assets, totalSupply(), newTotalAssets, Math.Rounding.Floor);\n\n        _deposit(_msgSender(), receiver, assets, shares);\n    }\n\n    /// @inheritdoc IERC4626\n    function mint(uint256 shares, address receiver) public override returns (uint256 assets) {\n        uint256 newTotalAssets = _accrueFee();\n\n        // Update `lastTotalAssets` to avoid an inconsistent state in a re-entrant context.\n        // It is updated again in `_deposit`.\n        lastTotalAssets = newTotalAssets;\n\n        assets = _convertToAssetsWithTotals(shares, totalSupply(), newTotalAssets, Math.Rounding.Ceil);\n\n        _deposit(_msgSender(), receiver, assets, shares);\n    }\n\n    /// @inheritdoc IERC4626\n    function withdraw(uint256 assets, address receiver, address owner) public override returns (uint256 shares) {\n        uint256 newTotalAssets = _accrueFee();\n\n        // Do not call expensive `maxWithdraw` and optimistically withdraw assets.\n\n        shares = _convertToSharesWithTotals(assets, totalSupply(), newTotalAssets, Math.Rounding.Ceil);\n\n        // `newTotalAssets - assets` may be a little off from `totalAssets()`.\n        _updateLastTotalAssets(newTotalAssets.zeroFloorSub(assets));\n\n        _withdraw(_msgSender(), receiver, owner, assets, shares);\n    }\n\n    /// @inheritdoc IERC4626\n    function redeem(uint256 shares, address receiver, address owner) public override returns (uint256 assets) {\n        uint256 newTotalAssets = _accrueFee();\n\n        // Do not call expensive `maxRedeem` and optimistically redeem shares.\n\n        assets = _convertToAssetsWithTotals(shares, totalSupply(), newTotalAssets, Math.Rounding.Floor);\n\n        // `newTotalAssets - assets` may be a little off from `totalAssets()`.\n        _updateLastTotalAssets(newTotalAssets.zeroFloorSub(assets));\n\n        _withdraw(_msgSender(), receiver, owner, assets, shares);\n    }\n\n    /// @inheritdoc IERC4626\n    function totalAssets() public view override returns (uint256 assets) {\n        for (uint256 i; i \u003c withdrawQueue.length; ++i) {\n            assets += MORPHO.expectedSupplyAssets(_marketParams(withdrawQueue[i]), address(this));\n        }\n    }\n\n    /* ERC4626 (INTERNAL) */\n\n    /// @inheritdoc ERC4626\n    function _decimalsOffset() internal view override returns (uint8) {\n        return DECIMALS_OFFSET;\n    }\n\n    /// @dev Returns the maximum amount of asset (`assets`) that the `owner` can withdraw from the vault, as well as the\n    /// new vault's total supply (`newTotalSupply`) and total assets (`newTotalAssets`).\n    function _maxWithdraw(address owner)\n        internal\n        view\n        returns (uint256 assets, uint256 newTotalSupply, uint256 newTotalAssets)\n    {\n        uint256 feeShares;\n        (feeShares, newTotalAssets) = _accruedFeeShares();\n        newTotalSupply = totalSupply() + feeShares;\n\n        assets = _convertToAssetsWithTotals(balanceOf(owner), newTotalSupply, newTotalAssets, Math.Rounding.Floor);\n        assets -= _simulateWithdrawMorpho(assets);\n    }\n\n    /// @dev Returns the maximum amount of assets that the vault can supply on Morpho.\n    function _maxDeposit() internal view returns (uint256 totalSuppliable) {\n        for (uint256 i; i \u003c supplyQueue.length; ++i) {\n            Id id = supplyQueue[i];\n\n            uint256 supplyCap = config[id].cap;\n            if (supplyCap == 0) continue;\n\n            uint256 supplyShares = MORPHO.supplyShares(id, address(this));\n            (uint256 totalSupplyAssets, uint256 totalSupplyShares,,) = MORPHO.expectedMarketBalances(_marketParams(id));\n            // `supplyAssets` needs to be rounded up for `totalSuppliable` to be rounded down.\n            uint256 supplyAssets = supplyShares.toAssetsUp(totalSupplyAssets, totalSupplyShares);\n\n            totalSuppliable += supplyCap.zeroFloorSub(supplyAssets);\n        }\n    }\n\n    /// @inheritdoc ERC4626\n    /// @dev The accrual of performance fees is taken into account in the conversion.\n    function _convertToShares(uint256 assets, Math.Rounding rounding) internal view override returns (uint256) {\n        (uint256 feeShares, uint256 newTotalAssets) = _accruedFeeShares();\n\n        return _convertToSharesWithTotals(assets, totalSupply() + feeShares, newTotalAssets, rounding);\n    }\n\n    /// @inheritdoc ERC4626\n    /// @dev The accrual of performance fees is taken into account in the conversion.\n    function _convertToAssets(uint256 shares, Math.Rounding rounding) internal view override returns (uint256) {\n        (uint256 feeShares, uint256 newTotalAssets) = _accruedFeeShares();\n\n        return _convertToAssetsWithTotals(shares, totalSupply() + feeShares, newTotalAssets, rounding);\n    }\n\n    /// @dev Returns the amount of shares that the vault would exchange for the amount of `assets` provided.\n    /// @dev It assumes that the arguments `newTotalSupply` and `newTotalAssets` are up to date.\n    function _convertToSharesWithTotals(\n        uint256 assets,\n        uint256 newTotalSupply,\n        uint256 newTotalAssets,\n        Math.Rounding rounding\n    ) internal view returns (uint256) {\n        return assets.mulDiv(newTotalSupply + 10 ** _decimalsOffset(), newTotalAssets + 1, rounding);\n    }\n\n    /// @dev Returns the amount of assets that the vault would exchange for the amount of `shares` provided.\n    /// @dev It assumes that the arguments `newTotalSupply` and `newTotalAssets` are up to date.\n    function _convertToAssetsWithTotals(\n        uint256 shares,\n        uint256 newTotalSupply,\n        uint256 newTotalAssets,\n        Math.Rounding rounding\n    ) internal view returns (uint256) {\n        return shares.mulDiv(newTotalAssets + 1, newTotalSupply + 10 ** _decimalsOffset(), rounding);\n    }\n\n    /// @inheritdoc ERC4626\n    /// @dev Used in mint or deposit to deposit the underlying asset to Morpho markets.\n    function _deposit(address caller, address receiver, uint256 assets, uint256 shares) internal override {\n        super._deposit(caller, receiver, assets, shares);\n\n        _supplyMorpho(assets);\n\n        // `lastTotalAssets + assets` may be a little off from `totalAssets()`.\n        _updateLastTotalAssets(lastTotalAssets + assets);\n    }\n\n    /// @inheritdoc ERC4626\n    /// @dev Used in redeem or withdraw to withdraw the underlying asset from Morpho markets.\n    /// @dev Depending on 3 cases, reverts when withdrawing \"too much\" with:\n    /// 1. NotEnoughLiquidity when withdrawing more than available liquidity.\n    /// 2. ERC20InsufficientAllowance when withdrawing more than `caller`'s allowance.\n    /// 3. ERC20InsufficientBalance when withdrawing more than `owner`'s balance.\n    function _withdraw(address caller, address receiver, address owner, uint256 assets, uint256 shares)\n        internal\n        override\n    {\n        _withdrawMorpho(assets);\n\n        super._withdraw(caller, receiver, owner, assets, shares);\n    }\n\n    /* INTERNAL */\n\n    /// @dev Returns the market params of the market defined by `id`.\n    function _marketParams(Id id) internal view returns (MarketParams memory) {\n        return MORPHO.idToMarketParams(id);\n    }\n\n    /// @dev Accrues interest on Morpho Blue and returns the vault's assets & corresponding shares supplied on the\n    /// market defined by `marketParams`, as well as the market's state.\n    /// @dev Assumes that the inputs `marketParams` and `id` match.\n    function _accruedSupplyBalance(MarketParams memory marketParams, Id id)\n        internal\n        returns (uint256 assets, uint256 shares, Market memory market)\n    {\n        MORPHO.accrueInterest(marketParams);\n\n        market = MORPHO.market(id);\n        shares = MORPHO.supplyShares(id, address(this));\n        assets = shares.toAssetsDown(market.totalSupplyAssets, market.totalSupplyShares);\n    }\n\n    /// @dev Reverts if `newTimelock` is not within the bounds.\n    function _checkTimelockBounds(uint256 newTimelock) internal pure {\n        if (newTimelock > ConstantsLib.MAX_TIMELOCK) revert ErrorsLib.AboveMaxTimelock();\n        if (newTimelock \u003c ConstantsLib.MIN_TIMELOCK) revert ErrorsLib.BelowMinTimelock();\n    }\n\n    /// @dev Sets `timelock` to `newTimelock`.\n    function _setTimelock(uint256 newTimelock) internal {\n        timelock = newTimelock;\n\n        emit EventsLib.SetTimelock(_msgSender(), newTimelock);\n\n        delete pendingTimelock;\n    }\n\n    /// @dev Sets `guardian` to `newGuardian`.\n    function _setGuardian(address newGuardian) internal {\n        guardian = newGuardian;\n\n        emit EventsLib.SetGuardian(_msgSender(), newGuardian);\n\n        delete pendingGuardian;\n    }\n\n    /// @dev Sets the cap of the market defined by `id` to `supplyCap`.\n    /// @dev Assumes that the inputs `marketParams` and `id` match.\n    function _setCap(MarketParams memory marketParams, Id id, uint184 supplyCap) internal {\n        MarketConfig storage marketConfig = config[id];\n\n        if (supplyCap > 0) {\n            if (!marketConfig.enabled) {\n                withdrawQueue.push(id);\n\n                if (withdrawQueue.length > ConstantsLib.MAX_QUEUE_LENGTH) revert ErrorsLib.MaxQueueLengthExceeded();\n\n                marketConfig.enabled = true;\n\n                // Take into account assets of the new market without applying a fee.\n                _updateLastTotalAssets(lastTotalAssets + MORPHO.expectedSupplyAssets(marketParams, address(this)));\n\n                emit EventsLib.SetWithdrawQueue(msg.sender, withdrawQueue);\n            }\n\n            marketConfig.removableAt = 0;\n        }\n\n        marketConfig.cap = supplyCap;\n\n        emit EventsLib.SetCap(_msgSender(), id, supplyCap);\n\n        delete pendingCap[id];\n    }\n\n    /* LIQUIDITY ALLOCATION */\n\n    /// @dev Supplies `assets` to Morpho.\n    function _supplyMorpho(uint256 assets) internal {\n        for (uint256 i; i \u003c supplyQueue.length; ++i) {\n            Id id = supplyQueue[i];\n\n            uint256 supplyCap = config[id].cap;\n            if (supplyCap == 0) continue;\n\n            MarketParams memory marketParams = _marketParams(id);\n\n            MORPHO.accrueInterest(marketParams);\n\n            Market memory market = MORPHO.market(id);\n            uint256 supplyShares = M /* FluxScope viewer — indexed, read-only view over one analysis result. */
(function () {
  'use strict';

    this.entChildren = Object.create(null);

    Object.keys(this.opChildren).forEach(function (k) {

    });

      (o.outputs || []).forEach(function (f) { var r = { flow: f, op: o, dir: 'out' }; self.flows.push(r); self.flowById[f.id] = r; });
    });

    this.posByHolder = Object.create(null);
    C.position.forEach(function (p) { push(self.posByAsset, p.asset, p); push(self.posByHolder, p.holder, p); });
    this.relFrom = Object.create(null);
    this.relTo = Object.create(null);
    C.relation.forEach(function (r) { push(self.relFrom, r.source, r); push(self.relTo, r.target, r); });
    this.exitsByPos = Object.create(null);
    this.exitsByOp = Object.create(null);
    C.exit.forEach(function (x) {
      push(self.exitsByPos, x.position, x);

    });

    C.unresolved.forEach(function (u) { (u.subjects || []).forEach(function (s) { push(self.unresolvedBySubject, s, u); }); });
    C.operation.forEach(function (o) {
      (o.unresolved || []).forEach(function (uid) {

      (x.unresolved || []).forEach(function (uid) {

    C.entity.forEach(function (x) { cite(x.id, x.evidence); });
    C.position.forEach(function (x) { cite(x.id, x.evidence); });
    C.relation.forEach(function (x) {
      cite(x.id, x.evidence);
      (x.conditions || []).forEach(function (c) { cite(x.id, c.evidence); });
      ((x.status || {}).checks || []).forEach(function (c) { cite(x.id, c.evidence); });
    });
    C.operation.forEach(function (o) {
      cite(o.id, o.evidence);
      (o.conditions || []).forEach(function (c) { cite(o.id, c.evidence); });
      (o.inputs || []).concat(o.outputs || []).forEach(function (f) { cite(o.id, f.evidence); });
      (o.participants || []).forEach(function (p) { cite(o.id, p.evidence); });

  Model.prototype.get = function (id) { return this.byId[id] || null; };

  Model.prototype.label = function (id) {
    var x = this.byId[id];

  Model.prototype.opAncestors = function (id) {

  Model.prototype.statusOf = function (id) {

  };

  Model.prototype.relationsOf = function (id) {

  Model.prototype.evidenceOf = function (id) {

    var self = this;
    var items = [];

    }
    this.c.asset.forEach(function (a) {
      add(a.id, 'asset', [a.id, a.label, a.symbol, a.kind, a.standard, a.identity && a.identity.expression, a.identity && a.identity.address, a.identity && a.identity.contract]);
    });
    this.c.entity.forEach(function (e) {
      add(e.id, 'entity', [e.id, e.label, e.kind, e.expression, e.description, e.contract && e.contract.name, e.contract && e.contract.address]);
    });

      add(o.id, 'operation', [o.id, o.label, o.kind, o.description, o.entrypoint && (o.entrypoint.contract + '.' + o.entrypoint.function), o.entrypoint && o.entrypoint.signature]);

  'use strict';
  var AL = window.FluxScope;

    asset_flow: { label: 'Asset flow (relation)', color: '#2f6fed', marker: 'arrow', desc: 'Asset movement recorded as a relation' },
    holds: { label: 'Holds', color: '#475569', marker: 'dot', desc: 'Entity holds the position' },
    claim: { label: 'Claim on', color: '#7c3aed', marker: 'diamond', desc: 'Position represents a claim on another position' },
    depends_on: { label: 'Depends on', color: '#ea580c', marker: 'open', desc: 'Value or redemption depends on the target' },
    exit: { label: 'Exit via', color: '#be123c', marker: 'arrow', desc: 'Position is exited through the operation' },
    exit_step: { label: 'Exit step', color: '#e11d48', marker: 'arrow', desc: 'Next operation of an exit path' },
    returns: { label: 'Returns', color: '#0f9d58', marker: 'arrow', desc: 'Asset returned to the recipient when exiting' },
    debt: { label: 'Owes', color: '#b91c1c', marker: 'arrow', desc: 'Debt position owed to the counterparty' },
    collateral: { label: 'Secures', color: '#a16207', marker: 'diamond', desc: 'Position is collateral for a debt' },
    binding: { label: 'Binding', color: '#0f766e', marker: 'open', desc: 'Configuration binds a variable to a contract' },
    calls: { label: 'Calls', color: '#64748b', marker: 'open', desc: 'Cross-contract call' },
    identity: { label: 'Same as', color: '#0891b2', marker: 'none', desc: 'Two expressions denote the same object' },
    initiates: { label: 'Triggers', color: '#94a3b8', marker: 'open', desc: 'Entity calls / triggers the operation' },
    contains: { label: 'Sub-operation', color: '#b4bccb', marker: 'open', desc: 'Nested step of an operation' },
    denominated: { label: 'Denominated in', color: '#cbd5e1', marker: 'none', desc: 'Position is a balance of the asset' }
  };

  var VIEWS = {
    code: { label: 'Code', nodes: ['entity', 'operation'], defaultOff: [], edges: ['flow', 'asset_flow', 'initiates', 'contains'], keepIsolated: ['operation'] },
    flows: { label: 'Flows', nodes: ['entity', 'operation'], defaultOff: [], edges: ['flow', 'asset_flow', 'initiates', 'contains'], keepIsolated: ['operation'] },
    holdings: { label: 'Holdings', nodes: ['entity', 'position', 'asset'], defaultOff: ['asset'], edges: ['holds', 'claim', 'debt', 'collateral', 'denominated'], depth: ['claim', 'collateral'], keepIsolated: ['position'] },

          return c ? c.text : cid;
        }).join('; ') }) : null,

  }
  D.flowRow = flowRow;

  function flowsOf(op) {
    return (op.inputs || []).map(function (f) { return Object.assign({ __dir: 'in' }, f); })

  function visibilityNote(M, id) {

  // ---------------------------------------------------------------------------
  // share / backing summary — the key interaction
  // ---------------------------------------------------------------------------
  function backingTree(M, posId, depth, seen) {
    if (depth > 6 || seen[posId]) return null;
    seen[posId] = true;
    var claims = (M.relFrom[posId] || []).filter(function (r) { return r.kind === 'claim'; });
    var deps = (M.relFrom[posId] || []).filter(function (r) { return r.kind === 'depends_on'; });
    if (!claims.length && !deps.length) return null;
    var ul = h('div', { class: 'backing', style: 'margin-left:' + (depth ? 12 : 0) + 'px; border-left:' + (depth ? '2px solid #e4dcfb' : '0') + '; padding-left:' + (depth ? 8 : 0) + 'px' });
    claims.forEach(function (r) {
      var t = M.get(r.target);
      var row = h('div', { class: 'item-card', 'data-claim': r.id }, [
        h('div', { class: 'ic-head' }, [
          h('span', { class: 'mini-chip', text: 'claims' }),
          chip(M, r.target),
          t ? h('span', { class: 'muted small' }, ['held by ', chip(M, t.holder)]) : null
        ]),
        h('div', { class: 'ic-sub' }, [r.label && r.label !== 'claim' ? r.label : null, r.basis_detail ? h('div', { class: 'mono', text: r.basis_detail }) : null]),
        r.conditions && r.conditions.length ? h('div', {}, condList(M, r.conditions)) : null,
        badges(r.status, [h('span', { class: 'ref', 'data-ref': r.id, text: 'relation details', style: 'font-size:11px' })]),
        evChips(M, r.evidence, 'claim')
      ]);
      ul.appendChild(row);
      var sub = backingTree(M, r.target, depth + 1, seen);
      if (sub) ul.appendChild(sub);
    });
    deps.forEach(function (r) {
      ul.appendChild(h('div', { class: 'item-card' }, [
        h('div', { class: 'ic-head' }, [h('span', { class: 'mini-chip', text: 'depends on' }), chip(M, r.target)]),
        r.label ? h('div', { class: 'ic-sub', text: r.label }) : null,
        badges(r.status),
        evChips(M, r.evidence, 'dependency')
      ]));
    });
    return ul;
  }

  function dependsList(M, ids) {
    var out = [];
    ids.forEach(function (id) {
      (M.relFrom[id] || []).forEach(function (r) { if (r.kind === 'depends_on' && out.indexOf(r) < 0) out.push(r); });
    });
    return out;
  }

  /** Walk claims transitively and collect every dependency target (protocols / contracts). */
  function transitiveDeps(M, startIds) {
    var seen = Object.create(null), out = [], q = startIds.slice();
    while (q.length) {
      var id = q.shift();
      if (seen[id]) continue;
      seen[id] = true;
      (M.relFrom[id] || []).forEach(function (r) {
        if (r.kind === 'claim') { q.push(r.target); var t = M.get(r.target); if (t && t.asset) q.push(t.asset); }
        if (r.kind === 'depends_on') { out.push({ rel: r, via: id }); q.push(r.target); }
      });
      var p = M.get(id);
      if (M.type(id) === 'position' && p && p.asset && !seen[p.asset]) q.push(p.asset);
    }
    return out;
  }

  function exitCard(M, x) {
    var steps = (x.steps || []).slice().sort(function (a, b) { return a.order - b.order; });
    var actors = U.uniq(steps.map(function (s) { return s.actor; }));
    return h('div', { class: 'item-card', 'data-exit-card': x.id }, [
      h('div', { class: 'ic-head' }, [h('span', { class: 'ic-title', text: x.label }), badges(x.status)]),
      h('div', { class: 'ic-sub' }, [
        U.plural(steps.length, 'step') + (steps.some(function (s) { return s.optional; }) ? ' (some conditional)' : '') + ' · actors: ',
        actors.length ? actors.map(function (a) { return chip(M, a); }) : h('span', { class: 'muted', text: 'not recorded' })
      ]),
      x.returns && x.returns.length ? h('div', { class: 'ic-sub' }, ['returns: '].concat(x.returns.map(function (f) { return h('span', {}, [amountEl(M, f.amount), f.to ? h('span', {}, [' to ', chip(M, f.to)]) : null, '  ']); }))) : null,
      h('div', { style: 'margin-top:5px; display:flex; gap:10px' }, [
        h('button', { class: 'link-btn', 'data-action': 'show-exit', 'data-target': x.id, text: 'Show exit path' }),
        h('span', { class: 'ref', 'data-ref': x.id, text: 'step details' })
      ])
    ]);
  }

  function shareSummary(M, asset, positions, focusPos) {
    var rows = [];
    var holders = positions.map(function (p) {
      return h('div', { class: p.id === focusPos ? 'hold-group' : 'hold-group' }, [

      ]);
    });
    rows.push(h('div', { class: 'ss-row', 'data-testid': 'share-holders' }, [h('div', { class: 'ss-k', text: 'Held by' }), h('div', {}, holders.length ? holders : [h('span', { class: 'muted', text: 'No holder positions recorded.' })])]));
    var issuer = asset.issuer ? h('div', {}, [chip(M, asset.issuer), h('span', { class: 'muted small', text: ' issues / accounts for this asset' })]) : null;
    if (issuer) rows.push(h('div', { class: 'ss-row' }, [h('div', { class: 'ss-k', text: 'Issued by' }), issuer]));
    var trees = h('div', {});
    var any = false;
    (focusPos ? positions.filter(function (p) { return p.id === focusPos; }) : positions).forEach(function (p) {
      var t = backingTree(M, p.id, 0, Object.create(null));
      if (t) {
        any = true;
        if (!focusPos && positions.length > 1) trees.appendChild(h('div', { class: 'small muted', style: 'margin:4px 0 2px' }, ['for ', chip(M, p.id)]));

    rows.push(h('div', { class: 'ss-row', 'data-testid': 'share-claims' }, [h('div', { class: 'ss-k', text: 'Claims on' }), any ? trees : h('span', { class: 'note-box warn', style: 'margin:0', text: 'No claim relation recorded — what this share is redeemable for is not established by the data.' })]));
    var deps = transitiveDeps(M, (focusPos ? [focusPos] : positions.map(function (p) { return p.id; })).concat([asset.id]));
    var depTargets = U.uniq(deps.map(function (d) { return d.rel.target; }));
    rows.push(h('div', { class: 'ss-row', 'data-testid': 'share-deps' }, [h('div', { class: 'ss-k', text: 'Depends on' }),
      depTargets.length ? h('div', {}, depTargets.map(function (t) {

          h('div', { class: 'small muted' }, rs.map(function (d) { return (d.rel.label || 'depends on') + ' (via ' + M.label(d.via) + ')'; }).join('; ')),
          evChips(M, [].concat.apply([], rs.map(function (d) { return d.rel.evidence || []; })), 'dependency')]);
      })) : h('span', { class: 'muted', text: 'No dependency relations recorded.' })]));
    var exits = [];

    rows.push(h('div', { class: 'ss-row', 'data-testid': 'share-exits' }, [h('div', { class: 'ss-k', text: 'Exit' }),
      exits.length ? h('div', {}, exits.map(function (x) { return exitCard(M, x); })) : h('span', { class: 'note-box warn', style: 'margin:0', text: 'No exit path recorded for this position.' })]));
    rows.push(h('div', { class: 'ss-note' }, 'A share is a claim on the positions it points to, not additional funds. Amounts are shown per asset and are never added across assets or across share and underlying.'));
    return sec('Share summary — who holds it, what backs it, how to exit', [h('div', { class: 'share-summary' }, rows)], { key: true, id: 'share-summary' });
  }

  function debtSummary(M, asset, positions, focusPos) {
    var rows = [];
    var shown = focusPos ? positions.filter(function (p) { return p.id === focusPos; }) : positions;
    rows.push(h('div', { class: 'ss-row', 'data-testid': 'debt-holders' }, [h('div', { class: 'ss-k', text: 'Owed by' }),
      h('div', {}, shown.map(function (p) {

          p.counterparty ? h('span', {}, [h('span', { class: 'muted small', text: '  owes  ' }), chip(M, p.counterparty)]) : null, evChips(M, p.evidence, 'position')]);
      }))]));

      })) : h('span', { class: 'muted', text: 'No debt relation recorded.' })]));

  // ---------------------------------------------------------------------------
  // per-type renderers

  function renderAsset(M, a) {

        idn.expression ? h('div', { class: 'k', text: 'expression' }) : null, idn.expression ? h('div', { class: 'v mono', text: idn.expression }) : null,
        idn.address ? h('div', { class: 'k', text: 'address' }) : null, idn.address ? h('div', { class: 'v mono', text: idn.address + (idn.chain_id ? ' (chain ' + idn.chain_id + ')' : '') }) : null,

      ]),

    ]));
    if (a.description) out.push(sec('Description', [h('div', { class: 'd-text', text: a.description })]));
    if (!(SHARE_ASSET[a.kind])) {
      out.push(sec('Holders', positions.length ? positions.map(function (p) {
        return h('div', { class: 'hold-group' }, [chip(M, p.holder), ' ', h('span', { class: 'mini-chip', text: p.kind }), ' ', p.amount ? amountEl(M, p.amount) : null, ' ', chip(M, p.id, 'position')]);
      }) : [h('div', { class: 'muted small', text: 'No positions in this asset.' })], { count: positions.length, id: 'holders' }));
    }

    if (moving.length) {

        return h('div', { class: 'hold-group' }, [chip(M, oid), ' ', h('span', { class: 'muted small', text: tags.join(', ') })]);
      }), { count: byOp.length }));
    }
    out.push(relationsSection(M, a.id));
    out.push(statusSection(M, a.status));
    out.push(unresolvedSection(M, [a.id]));
    out.push(evidenceSection(M, a.evidence, 'asset'));
    return out;
  }

  function relationsSection(M, id, exclude) {
    var rels = M.relationsOf(id).filter(function (r) { return !exclude || exclude.indexOf(r.kind) < 0; });
    if (!rels.length) return null;
    return sec('Relations', rels.map(function (r) {

      return h('div', { class: 'hold-group' }, [

      ]);

  function renderPosition(M, p) {
    var out = [];

      }), { count: changes.length }));
    }

    out.push(statusSection(M, p.status));

  var HOLD_GROUPS = [

    ['claim', 'Non-tokenised claims'], ['collateral', 'Collateral'], ['reward', 'Rewards'], ['debt', 'Debts owed (obligations, not assets)']
  ];

  function renderEntity(M, e) {

  function poll(app, api, id, jobBox, done) {
    var base = api.replace(/\/$/, '');
    fetch(base + '/jobs/' + encodeURIComponent(id)).then(function (r) { return r.json(); }).then(function (job) {
      U.clear(jobBox).appendChild(h('div', { class: 'job-box', 'data-testid': 'job-box' }, [
        h('div', {}, ['Job ', h('span', { class: 'mono', text: job.id }), ': ', h('span', { class: 'job-status ' + job.status, text: job.status }), job.stage ? h('span', { class: 'muted', text: ' · ' + job.stage }) : null]),
        job.error ? h('div', { class: 'job-status failed', text: job.error }) : null,
        (job.log && job.log.length) ? h('div', { class: 'job-log', text: job.log.slice(-12).join('\n') }) : null
      ]));
      if (job.status === 'succeeded') {
        done();
        fetch(base + '/jobs/' + encodeURIComponent(id) + '/result').then(function (r) { return r.text(); }).then(function (txt) {
          app.importText(txt, 'analysis job ' + id, 'backend');
        });
      } else if (job.status === 'failed') {
        done();
      } else {
        setTimeout(function () { poll(app, api, id, jobBox, done); }, 1000);
      }
    }).catch(function (e) {
      done();
      jobBox.appendChild(h('div', { class: 'job-status failed', text: 'Lost contact with backend: ' + e.message }));
    });
  }

  function swatchNode(type, kind) {
    var st = AL.render.styles;
    var svg = U.s('svg', { width: 30, height: 18, viewBox: '0 0 30 18' });
    if (type === 'entity') {
      var es = st.ENTITY_STYLE[kind] || st.ENTITY_STYLE.unknown;
      svg.appendChild(U.s('rect', { x: 1, y: 2, width: 28, height: 14, rx: 4, fill: es.fill, stroke: es.stroke, 'stroke-width': 1.4, 'stroke-dasharray': es.dash || null }));
      svg.appendChild(U.s('circle', { cx: 8, cy: 9, r: 4.5, fill: es.stroke }));
    } else if (type === 'operation') {
      svg.appendChild(U.s('rect', { x: 1, y: 2, width: 28, height: 14, rx: 7, fill: '#fff8ea', stroke: '#d98a1a', 'stroke-width': 1.4 }));
      svg.appendChild(U.s('circle', { cx: 8, cy: 9, r: 4.5, fill: '#d98a1a' }));
    } else if (type === 'position') {
      var pc = st.POSITION_COLOR[kind] || '#64748b';
      svg.appendChild(U.s('rect', { x: 1, y: 2, width: 28, height: 14, rx: 2, fill: '#fff', stroke: pc, 'stroke-width': 1.4 }));
      svg.appendChild(U.s('rect', { x: 1.5, y: 2.5, width: 4, height: 13, fill: pc }));
    } else if (type === 'asset') {
      svg.appendChild(U.s('path', { d: 'M6,2 H28 V16 H6 L1,9 Z', fill: '#f6f8fb', stroke: '#64748b', 'stroke-width': 1.4 }));
    }
    return svg;
  }
  function swatchEdge(kind, dash, colorOverride) {
    var meta = AL.graph.EDGE_KINDS[kind] || {};
    var col = colorOverride || meta.color || '#64748b';
    var svg = U.s('svg', { width: 34, height: 14, viewBox: '0 0 34 14' });
    svg.appendChild(U.s('line', { x1: 2, y1: 7, x2: 27, y2: 7, stroke: col, 'stroke-width': 2, 'stroke-dasharray': dash || null }));
    var mk = meta.marker;
    if (mk === 'arrow' || colorOverride) svg.appendChild(U.s('path', { d: 'M25,2.5 L32,7 L25,11.5 Z', fill: col }));
    else if (mk === 'open') svg.appendChild(U.s('path', { d: 'M25,2.5 L32,7 L25,11.5', fill: 'none', stroke: col, 'stroke-width': 1.6 }));
    else if (mk === 'diamond') svg.appendChild(U.s('path', { d: 'M26,7 L29.5,3.5 L33,7 L29.5,10.5 Z', fill: '#fff', stroke: col, 'stroke-width': 1.4 }));
    else if (mk === 'dot') svg.appendChild(U.s('circle', { cx: 29, cy: 7, r: 3, fill: col }));
    return svg;
  }
