    work.addEventListener('mousedown', function (ev) { drag = { kind: 'w', x: ev.clientX, w: pane.getBoundingClientRect().width, total: pane.parentElement.getBoundingClientRect().width }; ev.preventDefault(); });
    det.addEventListener('mousedown', function (ev) {
      var slot = document.getElementById('details-slot');
      drag = { kind: 'd', y: ev.clientY, h: slot.getBoundingClientRect().height, total: slot.parentElement.getBoundingClientRect().height };
      ev.preventDefault();
    });
    window.addEventListener('mousemove', function (ev) {
      if (!drag) return;
      if (drag.kind === 'w') {
        var w = Math.max(320, Math.min(drag.total - 320, drag.w + ev.clientX - drag.x));
        document.documentElement.style.setProperty('--code-w', (100 * w / drag.total).toFixed(1) + '%');
      } else {
        var hh = Math.max(80, Math.min(drag.total - 140, drag.h - (ev.clientY - drag.y)));
        document.documentElement.style.setProperty('--details-h', hh + 'px');
      }
    });
    window.addEventListener('mouseup', function () { if (drag) { drag = null; AL.render.fit(); } });
  }

  // ---------------------------------------------------------------------------
  // model / outline
  // ---------------------------------------------------------------------------
  CV.reset = function (M) {
    X = buildIndex(M);
    file = null;
    rows = [];
    hovered = []; selected = [];
    CV.history = [];
    filterInput.value = '';
    U.clear(filesEl);
    var files = Object.keys(M.sources).sort();
    filesEl.appendChild(h('option', { value: '', text: files.length ? 'Files (' + files.length + ')' : 'No source files' }));
    files.forEach(function (f) { filesEl.appendChild(h('option', { value: f, text: f })); });
    filesEl.disabled = !files.length;
    pathEl.textContent = '';
    hintEl.hidden = true;
    U.clear(bodyEl).appendChild(h('div', { class: 'code-empty' }, files.length
      ? 'Pick a function on the left. Its source opens here and the graph on the right shows only what that function does: who calls it, which assets move between whom, and the contracts it calls.'
      : 'This result embeds no source files. Functions can still be opened from the list; the graph shows what they do.'));
    renderOutline();
  };

  CV.hasCode = function (M) {
    return M.c.operation.some(function (o) {
      return !o.parent && (o.evidence || []).some(function (ev) { var e = M.get(ev); return e && e.source && M.sources[e.source.file]; });
    });
  };

  function renderOutline() {
    if (!X) return;
    var M = AL.app.model, st = AL.app.state, q = filterInput.value.trim().toLowerCase();
    var cur = st.code.op, pins = st.code.pins;
    U.clear(outlineList);
    X.groups.forEach(function (g) {
      var list = g.ops.filter(function (o) {
        return !q || (o.label + ' ' + o.kind + ' ' + (o.entrypoint ? o.entrypoint.signature : '')).toLowerCase().indexOf(q) >= 0;
      });
      if (!list.length) return;
      outlineList.appendChild(h('div', { class: 'co-inst', 'data-entity': g.id, 'data-file': g.file || null, title: g.file ? 'Open ' + g.file : g.label }, [
        g.label, g.file ? h('div', { class: 'co-file', text: g.file.split('/').pop() }) : null
      ]));
      var inherited = false;
      list.forEach(function (o) {
        var d = X.def[o.id];
        if (!inherited && g.file && (!d || d.file !== g.file)) {
          inherited = true;
          outlineList.appendChild(h('div', { class: 'co-sub', text: 'inherited' }));
        }
        var quiet = !X.hasFlow[o.id], pinned = pins.indexOf(o.id) >= 0;
        var name = o.entrypoint && o.entrypoint.function ? o.entrypoint.function : o.label;
        outlineList.appendChild(h('div', {
          class: 'co-item' + (o.id === cur && st.code.mode !== 'map' ? ' active' : '') + (pinned ? ' pinned' : '') + (quiet ? ' quiet' : ''),
          'data-op': o.id,
          title: o.label + ' — ' + U.humanize(o.kind) + (o.initiator ? ', called by ' + M.label(o.initiator) : '') + (quiet ? ' (moves no assets)' : '') + (d ? '\n' + d.file + ':' + d.start : '')
        }, [
          h('span', { class: 'co-glyph', text: AL.render.styles.OP_GLYPH[o.kind] || '•' }),
          h('span', { class: 'co-name', text: name }),
          h('span', { class: 'co-kind', text: U.humanize(o.kind) }),
          h('button', { class: 'co-pin', title: pinned ? 'Remove from the graph' : 'Pin: keep this function in the graph while you open others', text: pinned ? 'pinned' : 'pin' })
        ]));
      });
    });
    var active = outlineList.querySelector('.co-item.active');
    if (active) {
      var r = active.getBoundingClientRect(), b = outlineList.getBoundingClientRect();
      if (r.top < b.top || r.bottom > b.bottom) outlineList.scrollTop += r.top - b.top - b.height / 3;
    }
  }

  // ---------------------------------------------------------------------------
  // source
  // ---------------------------------------------------------------------------
  /** Show a file. opts: {line, push (remember the previous location), top (scroll to line 1)} */
  CV.showFile = function (path, opts) {
    opts = opts || {};
    var M = AL.app.model, src = M && M.sources[path];
    if (!src) return false;
    if (path !== file) {
      if (opts.push && file) remember();
      file = path;
      var lines = AL.code.highlight(src.content, src.language === 'solidity' ? 'solidity' : 'text');
      var marks = X.lines[path] || {};
      var html = [];
      for (var i = 0; i < lines.length; i++) {
        var n = i + 1, items = marks[n], cls = '';
        if (items) cls = items.some(function (x) { return x.k === 'flow'; }) ? 'm-flow' : items.some(function (x) { return x.k === 'cond'; }) ? 'm-cond' : 'm-call';
        html.push('<tr data-line="' + n + '" class="' + cls + '"><td class="ln">' + n + '</td><td class="gt"></td><td class="cd">' + (lines[i] || ' ') + '</td></tr>');
      }
      bodyEl.innerHTML = (src.synthetic ? '<div class="note-box warn">Synthetic example source — not from a real project.</div>' : '') +
        '<div class="src-view" data-file="' + U.esc(path) + '"><table>' + html.join('') + '</table></div>';
      rows = Array.prototype.slice.call(bodyEl.querySelectorAll('tr'));
      hovered = []; selected = [];
      var parts = path.split('/');
      pathEl.innerHTML = U.esc(parts.slice(0, -1).join('/') + (parts.length > 1 ? '/' : '')) + '<b>' + U.esc(parts[parts.length - 1]) + '</b>';
      pathEl.title = path;
      filesEl.value = '';
      CV.annotate();
    }
    if (opts.line) scrollTo(opts.line, opts.force);
    else if (opts.top) bodyEl.scrollTop = 0;
    return true;
  };

  function remember() {
    CV.history.push({ file: file, top: bodyEl.scrollTop });
    if (CV.history.length > 40) CV.history.shift();
    document.getElementById('btn-code-back').disabled = false;
  }
  function goBack() {
    var last = CV.history.pop();
    document.getElementById('btn-code-back').disabled = !CV.history.length;
    if (!last) return;
    CV.showFile(last.file);
    bodyEl.scrollTop = last.top;
  }

  function row(n) { return rows[n - 1] || null; }

  function scrollTo(line, force) {
    var r = row(line);
    if (!r) return;
    var top = r.offsetTop, vis = bodyEl.scrollTop, hgt = bodyEl.clientHeight;
    if (!force && top > vis + 20 && top < vis + hgt - 40) return;
    bodyEl.scrollTop = Math.max(0, top - Math.max(40, hgt * 0.22));
  }

  /** Mark the open function(s) and annotate their statements in the file shown. */
  CV.annotate = function () {
    if (!file) return;
    var M = AL.app.model, st = AL.app.state;
    U.$$('tr.lens', bodyEl).forEach(function (a) { a.remove(); });
    rows.forEach(function (r) { r.classList.remove('fn', 'c-flow', 'c-mint', 'c-burn', 'c-cond', 'c-call'); });
    var roots = AL.graph.codeRoots(st);
    if (!roots.length) return;
    var inGraph = Object.create(null);
    roots.forEach(function (r) {
      inGraph[r] = true;
      M.opDescendants(r).forEach(function (d) { inGraph[d.id] = true; });
    });
    var current = Object.create(null);
    if (st.code.op) {
      current[st.code.op] = true;
      M.opDescendants(st.code.op).forEach(function (d) { current[d.id] = true; });
    }
    Object.keys(current).forEach(function (id) {
      var d = X.def[id];
      if (d && d.file === file) for (var n = d.start; n <= d.end; n++) { var r = row(n); if (r) r.classList.add('fn'); }
    });
    // annotations go into a lens row above the statement, indented like it, so long lines never hide them
    var heads = Object.create(null);
    Object.keys(current).forEach(function (id) {
      var d = X.def[id], o = M.get(id);
      if (!d || d.file !== file || !o) return;
      (heads[d.start] || (heads[d.start] = [])).push(headPill(M, o));
    });
    var marks = Object.create(null);
    Object.keys(X.lines[file] || {}).concat(Object.keys(heads)).forEach(function (n) { marks[n] = itemsAt(+n); });
    Object.keys(marks).forEach(function (n) {
      var r = row(+n);
      if (!r) return;
      var seen = Object.create(null), pills = (heads[n] || []).slice();
      marks[n].forEach(function (it) {
        if (!inGraph[it.op] && !(it.k === 'call' && inGraph[it.id])) return;
        var a = annotation(M, it);
        if (!a) return;
        r.classList.add('c-' + a.cls);
        // one pill per statement and reading (nested calls often repeat the same guard)
        var key = a.tag + '|' + a.text;
        if (!it.first || !current[it.k === 'call' ? it.id : it.op] || seen[key]) return;
        seen[key] = true;
        pills.push(h('span', { class: 'ann a-' + a.cls, 'data-k': it.k, 'data-id': it.id, 'data-op': it.op, title: a.title }, [h('b', { text: a.tag }), a.text]));
      });
      if (!pills.length) return;
      var indent = /^\s*/.exec(r.lastChild.textContent)[0].replace(/\t/g, '    ').length;
      var lens = h('tr', { class: 'lens' + (r.classList.contains('fn') ? ' fn' : ''), 'data-line': n }, [
        h('td', { class: 'ln' }), h('td', { class: 'gt' }), h('td', { class: 'cd', style: 'padding-left: calc(8px + ' + indent + 'ch)' }, pills)
      ]);
      r.parentNode.insertBefore(lens, r);
    });
  };

  /** Summary on the function header: what kind of operation the analysis made of it and who may call it. */
  function headPill(M, o) {
    var flows = (o.inputs || []).length + (o.outputs || []).length, kids = (M.opChildren[o.id] || []).length;
    var st = o.status || {};
    var bits = [o.initiator ? 'called by ' + M.label(o.initiator) : 'caller not recorded', U.plural(flows, 'asset flow')];
    if (kids) bits.push(U.plural(kids, 'call') + ' into other functions');
    if (st.support === 'llm') bits.push('kind proposed by the model');
    return h('span', { class: 'ann a-head', 'data-k': 'op', 'data-id': o.id, 'data-op': o.id,
      title: o.label + ' — ' + U.humanize(o.kind) + (st.rule ? ' (' + st.rule + ')' : '') + (st.note ? '\n' + st.note : '') }, [
      h('b', { text: String(o.kind).toUpperCase().replace(/_/g, ' ') }), bits.join(' · ')
    ]);
  }

  function shortEnt(M, id) {
    var e = M.get(id);
    if (!e) return id || '?';
    if (e.kind !== 'contract' && e.kind !== 'external_contract' && e.kind !== 'protocol' && e.expression &&
        (e.kind === 'unknown' || /^[A-Za-z_$][\w$]*$/.test(e.expression))) return e.expression;
    return e.label;
  }

  function annotation(M, it) {
    if (it.k === 'flow') {
      var fr = M.flowById[it.id];
      if (!fr) return null;
      var f = fr.flow, mech = f.mechanism || '';
      var tag, cls;
      if (!f.from) { tag = mech === 'credit' ? 'CREDIT' : 'MINT'; cls = 'mint'; }
      else if (!f.to) { tag = mech === 'debit' ? 'DEBIT' : 'BURN'; cls = 'burn'; }
      else { tag = 'TRANSFER'; cls = 'flow'; }
      var text = M.assetShort(f.asset) + '  ' + (f.from ? shortEnt(M, f.from) : '') + (f.from && f.to ? ' → ' : f.to ? '→ ' : '') + (f.to ? shortEnt(M, f.to) : '');
      return { tag: tag, cls: cls, text: text, title: tag.toLowerCase() + ' ' + M.amountText(f.amount) + (f.from ? ' from ' + M.label(f.from) : '') + (f.to ? ' to ' + M.label(f.to) : '') + ' — in ' + fr.op.label + ' (click to select in the graph)' };
    }
    if (it.k === 'cond') {
      var c = it.cond, op = M.get(it.op);
      if (c.kind === 'access_control') return { tag: 'WHO', cls: 'cond', text: op && op.initiator ? 'only ' + M.label(op.initiator) : c.text, title: c.text };
      if (c.kind === 'branch') return { tag: 'IF', cls: 'cond', text: U.truncate(c.text, 80), title: c.text + ' — the following step runs only in this case' };
      var tag = { external: 'NEEDS', loop: 'LOOP', timing: 'WHEN' }[c.kind] || 'GUARD';
      return { tag: tag, cls: 'cond', text: U.truncate(c.text, 80), title: U.humanize(c.kind) + ': ' + c.text };
    }
    if (it.k === 'call') {
      var o = M.get(it.id);
      if (!o) return null;
      return { tag: 'CALL', cls: 'call', text: o.label + (o.transaction === 'separate' ? ' (separate tx)' : ''), title: 'Calls ' + o.label + ' — ' + U.humanize(o.kind) + ' executed by ' + M.label(o.executor) };
    }
    return null;
  }

  // ---------------------------------------------------------------------------
  // source -> graph
  // ---------------------------------------------------------------------------
  /** Items on a line, without those cited only as part of a call path: a flow or guard of a nested
   *  call that lies inside the definition of one of its callers is shown at the CALL instead. */
  function onPath(it, n) {
    if (it.k === 'call') return false;
    var anc = AL.app.model.opAncestors(it.op);
    for (var i = 0; i < anc.length; i++) {
      var d = X.def[anc[i]];
      if (d && d.file === file && n >= d.start && n <= d.end) return true;
    }
    return false;
  }
  function itemsAt(n) {
    var all = file && X.lines[file] ? X.lines[file][n] || [] : [];
    return all.filter(function (it) { return !onPath(it, n); });
  }

  /** Graph elements supported by the given line items. */
  function graphTargets(items) {
    var G = AL.app.graph, nodes = [], edges = [];
    if (!G) return { nodes: nodes, edges: edges };
    items.forEach(function (it) {
      if (it.k === 'flow') {
        G.edges.forEach(function (e) { if (e.refs.some(function (r) { return r.type === 'flow' && r.id === it.id; })) edges.push(e.id); });
      } else if (it.k === 'cond') {
        if (G.byId[it.op]) nodes.push(it.op);
        var o = AL.app.model.get(it.op);
        if (it.cond.kind === 'access_control' && o && G.byId[o.initiator]) nodes.push(o.initiator);
      } else if (it.k === 'call') {
        if (G.byId[it.id]) nodes.push(it.id);
        G.edges.forEach(function (e) { if (e.kind === 'contains' && e.target === it.id) edges.push(e.id); });
      }
    });
    return { nodes: U.uniq(nodes), edges: U.uniq(edges) };
  }

  function onLineHover(ev) {
    var tr = ev.target.closest && ev.target.closest('tr[data-line]');
    if (!tr) return;
    var ann = ev.target.closest('.ann');
    if (ann && ann.dataset.k === 'op') { AL.render.flash([ann.dataset.id], []); return; }
    var items = itemsAt(+tr.dataset.line);
    if (ann) items = items.filter(function (it) { return it.k === ann.dataset.k && it.id === ann.dataset.id; });
    var t = graphTargets(items);
    AL.render.flash(t.nodes, t.edges);
  }

  function onLineClick(ev) {
    var tr = ev.target.closest && ev.target.closest('tr[data-line]');
    if (!tr || (window.getSelection && String(window.getSelection()).length)) return;
    var n = +tr.dataset.line, app = AL.app, M = app.model, st = app.state;
    var ann = ev.target.closest('.ann');
    if (ann && ann.dataset.k === 'op') { app.select(ann.dataset.id); return; }
    var items = itemsAt(n);
    if (ann) items = items.filter(function (it) { return it.k === ann.dataset.k && it.id === ann.dataset.id; });
    var roots = AL.graph.codeRoots(st);
    var shown = Object.create(null);
    roots.forEach(function (r) { shown[r] = true; M.opDescendants(r).forEach(function (d) { shown[d.id] = true; }); });
    // a statement of a function in the graph: select what it supports
    var mine = items.filter(function (it) { return shown[it.k === 'call' ? it.id : it.op]; });
    if (mine.length) {
      var t = graphTargets(mine);
      if (t.edges.length && mine[0].k === 'flow') { app.selectEdge(t.edges[0]); return; }
      app.select(mine[0].k === 'call' ? mine[0].id : mine[0].op);
      return;
    }
    // otherwise: open the innermost function defined around this line
    // (several operations can share a definition, e.g. an inherited function of two contracts:
    // prefer one already in the graph, then an entry point)
    var best = null, span = Infinity;
    function rank(id) { return (shown[id] ? 0 : 2) + (M.get(id).parent ? 1 : 0); }
    Object.keys(X.def).forEach(function (id) {
      var d = X.def[id], s = d.end - d.start;
      if (d.file !== file || n < d.start || n > d.end) return;
      if (s < span || (s === span && rank(id) < rank(best))) { best = id; span = s; }
    });
    if (!best) return;
    if (shown[best]) app.select(best);
    else app.openFunction(M.get(best).parent ? X.rootOf[best] : best, { keepScroll: true });
  }

  // ---------------------------------------------------------------------------
  // graph -> source
  // ---------------------------------------------------------------------------
  function locsOfEvidence(ids) {
    var M = AL.app.model, out = [];
    (ids || []).forEach(function (id) {
      var e = M.get(id);
      if (e && e.source && M.sources[e.source.file]) out.push({ file: e.source.file, start: e.source.start_line, end: e.source.end_line || e.source.start_line });
    });
    return out;
  }
  function stmts(locs) { return locs.filter(function (l) { return l.end - l.start < STMT_SPAN; }); }

  /** Source locations behind a graph node or edge. */
  function locsFor(target) {
    var M = AL.app.model, out = [];
    if (target.edge) {
      target.edge.refs.forEach(function (r) {
        if (r.type === 'flow') { var fr = M.flowById[r.id]; if (fr) out = out.concat(stmts(locsOfEvidence(fr.flow.evidence))); }
        else if (r.type === 'relation') out = out.concat(locsOfEvidence((M.get(r.id) || {}).evidence));
        else if (r.type === 'contains') out = out.concat(X.calls[r.id] || []);
        else if (r.type === 'initiator') {
          var o = M.get(r.id);
          (o && o.conditions || []).forEach(function (c) { if (c.kind === 'access_control') out = out.concat(locsOfEvidence(c.evidence)); });
        }
      });
      return out;
    }
    var id = target.node, t = M.type(id), G = AL.app.graph;
    if (t === 'operation') {
      if (X.calls[id] && X.calls[id].length) return X.calls[id];
      var d = X.def[id];
      return d ? [{ file: d.file, start: d.start, end: d.start }] : [];
    }
    if (t === 'entity' && G && !G.map) {
      // lines where the entity pays or receives, and the guards that make it the caller
      G.edges.forEach(function (e) {
        if (e.source !== id && e.target !== id) return;
        e.refs.forEach(function (r) {
          if (r.type !== 'flow') return;
          var fr = M.flowById[r.id];
          if (fr && (fr.flow.from === id || fr.flow.to === id)) out = out.concat(stmts(locsOfEvidence(fr.flow.evidence)));
        });
      });
      G.nodes.forEach(function (n) {
        if (n.type !== 'operation' || n.obj.initiator !== id) return;
        (n.obj.conditions || []).forEach(function (c) { if (c.kind === 'access_control') out = out.concat(locsOfEvidence(c.evidence)); });
      });
      return out;
    }
    if (t === 'entity') {
      var e = M.get(id);
      if (e && e.contract && e.contract.file && M.sources[e.contract.file]) return [];
    }
    return out;
  }

  function rowsFor(locs) {
    var out = [];
    locs.forEach(function (l) {
      if (l.file !== file) return;
      for (var n = l.start; n <= l.end; n++) { var r = row(n); if (r) out.push(r); }
    });
    return out;
  }
  function markRows(list, on, cls) { list.forEach(function (r) { r.classList.toggle(cls || 'xhl', on); }); }

  function showHint(locs, verb) {
    var other = locs.filter(function (l) { return l.file !== file; });
    if (!other.length || locs.length > other.length) { hintEl.hidden = true; return; }
    var seen = Object.create(null);
    U.clear(hintEl).appendChild(document.createTextNode(verb + ' in another file:'));
    other.forEach(function (l) {
      var k = l.file + '#' + l.start;
      if (seen[k] || Object.keys(seen).length >= 4) return;
      seen[k] = true;
      hintEl.appendChild(h('a', { class: 'ref', 'data-goto': l.file + '#' + l.start + '#' + l.end, text: l.file.split('/').pop() + ':' + l.start }));
    });
    hintEl.hidden = false;
  }

  /** Graph hover: highlight the lines behind the item (null clears). */
  CV.hoverGraph = function (target) {
    if (!file) return;
    markRows(hovered, false);
    hovered = [];
    if (!target) { showHint([], ''); return; }
    var locs = locsFor(target);
    hovered = rowsFor(locs);
    markRows(hovered, true);
    showHint(locs, 'Defined');
  };

  /** A graph item was selected: bring its source into view. sel: {id} | {edge} */
  CV.reveal = function (sel) {
    if (!X) return;
    var M = AL.app.model;
    markRows(selected, false, 'xsel');
    selected = [];
    var locs = [];
    if (sel && sel.edge) locs = locsFor({ edge: sel.edge });
    else if (sel && sel.id) {
      var t = M.type(sel.id);
      if (t === 'operation') {
        var d = X.def[sel.id];
        // a nested call: its call site when the caller is on screen, otherwise the callee's definition
        var calls = (X.calls[sel.id] || []).filter(function (l) { return l.file === file; });
        if (calls.length) locs = calls;
        else if (d) { CV.showFile(d.file, { push: true }); scrollTo(d.start, true); return; }
      } else if (t === 'entity') {
        var e = M.get(sel.id);
        if (AL.app.graph && AL.app.graph.map && e && e.contract && e.contract.file && M.sources[e.contract.file]) {
          CV.openContract(e.id, true);
          return;
        }
        locs = locsFor({ node: sel.id });
      }
    }
    if (!locs.length) return;
    if (!locs.some(function (l) { return l.file === file; })) CV.showFile(locs[0].file, { push: true });
    selected = rowsFor(locs);

        var u = q.shift();
        G.edges.forEach(function (e) {
          var from = down ? e.source : e.target, to = down ? e.target : e.source;
          if (from !== u) return;
          edges[e.id] = true;
          nodes[to] = true;
          if (!seen[to]) { seen[to] = true; q.push(to); }
        });
      }
    }
    if (mode === 'down' || mode === 'both') walk(true);
    if (mode === 'up' || mode === 'both') walk(false);
    return { nodes: nodes, edges: edges };
  }

  function applyHighlight() {
    var st = app.state, G = app.graph;
    if (!G) return;
    var hl = { selNode: null, selEdge: null, nodes: null, edges: null, matches: null };
    if (st.search) {
      hl.matches = Object.create(null);
      app.model.search(st.search, 200).forEach(function (r) { graphNodesFor(r.id).forEach(function (n) { hl.matches[n] = true; }); });
    }
    if (st.focus) {
      hl.nodes = Object.create(null); hl.edges = Object.create(null);
      st.focus.forEach(function (id) { graphNodesFor(id).forEach(function (n) { hl.nodes[n] = true; }); });
      G.edges.forEach(function (e) {
        var inFocus = hl.nodes[e.source] && hl.nodes[e.target];
        var exitRef = st.focusExit && e.refs.some(function (r) { return (r.type === 'exit' || r.type === 'exit-return') && r.id === st.focusExit; });
        var relRef = e.refs.some(function (r) { return st.focus.indexOf(r.id) >= 0; });
        if (exitRef || relRef || (inFocus && !st.focusExit)) hl.edges[e.id] = true;
      });
    }
    var sel = st.selection;
    if (sel && sel.edgeKey) {
      var e = findEdge(sel.edgeKey);
      if (e) {
        hl.selEdge = e.id;
        if (!st.focus) {
          hl.nodes = Object.create(null); hl.edges = Object.create(null);
          hl.nodes[e.source] = hl.nodes[e.target] = true; hl.edges[e.id] = true;
        }
      }
    } else if (sel && sel.id) {
      var ids = graphNodesFor(sel.id);
      if (ids.length === 1 && ids[0] === sel.id) hl.selNode = sel.id;
      else if (ids.length === 1) hl.selNode = ids[0];
      // the Code view graph is already small: no dimming of everything but the related paths
      if (!st.focus && st.related !== 'off' && st.view !== 'code' && ids.length) {
        var r = related(ids, st.related);
        hl.nodes = r.nodes; hl.edges = r.edges;
      } else if (!st.focus && ids.length > 1) {
        hl.nodes = Object.create(null); ids.forEach(function (n) { hl.nodes[n] = true; }); hl.edges = Object.create(null);
      }
    }
    AL.render.highlight(hl);
  }

  // ---------------------------------------------------------------------------
  // selection / navigation
  // ---------------------------------------------------------------------------
  app.select = function (id, opts) {
    opts = opts || {};
    var M = app.model;
    if (!M) return;
    // Code view: an operation outside the functions in the graph is opened as a function
    if (app.state.view === 'code' && M.type(id) === 'operation') {
      if (app.state.code.mode === 'map' || AL.graph.codeRoots(app.state).indexOf(AL.codeview.rootOf(id)) < 0) { app.openFunction(id); return; }
      // a nested call of a function in the graph: open the levels down to it
      var hidden = M.opAncestors(id).filter(function (a) { return !app.state.expandedOps[a]; });
      if (hidden.length) {
        hidden.forEach(function (a) { app.state.expandedOps[a] = true; });
        app.state.selection = { id: id };
        app.refresh({ anchor: hidden[0] });
        AL.codeview.reveal({ id: id });
        return;
      }
    }
    app.state.selection = { id: id };
    if (!opts.keepFocus) { app.state.focus = null; app.state.focusExit = null; if (!opts.keepTask) app.state.task = null; }
    if (opts.reveal && !app.isVisible(id)) {
      app.reveal(id, { silent: true });
    } else {
      applyHighlight();
      renderDetails();
    }
    var g = graphNodesFor(id);
    if (g.length) AL.render.centerOn(g[0]);
    if (!opts.keepTask) S.renderTasks(app);
    if (app.state.view === 'code') AL.codeview.reveal({ id: id });
  };

  app.selectEdge = function (graphEdgeId) {
    var e = app.graph.edges.filter(function (x) { return x.id === graphEdgeId; })[0];
    if (!e) return;
    app.state.selection = { edgeKey: e.key, edge: e };
    app.state.focus = null; app.state.focusExit = null;
    applyHighlight();
    renderDetails();
    if (app.state.view === 'code') AL.codeview.reveal({ edge: e });
  };

  app.clearSelection = function () {
    app.state.selection = null;
    app.state.focus = null; app.state.focusExit = null; app.state.task = null;
    applyHighlight();
    renderDetails();
    S.renderTasks(app);
    if (app.state.view === 'code') AL.codeview.reveal(null);
  };

  /** Make an object visible: switch view, expand ancestors, dependency path, reset filters if needed. */
  app.reveal = function (id, opts) {
    opts = opts || {};
    var M = app.model, st = app.state;
    var t = M.type(id), x = M.get(id);
    if (!x) return;
    if (st.view === 'code' && t === 'operation') { app.openFunction(id); return; }
    var targets = [id];
    if (t === 'relation') targets = [x.source, x.target];
    if (t === 'exit') targets = [x.position];
    if (t === 'unresolved') targets = (x.subjects || []).slice(0, 1);
    var pv = AL.graph.preferredView(M, id, st.view);
    if (!app.isVisible(id)) st.view = pv;
    targets.forEach(function (tid) {
      var tt = M.type(tid);
      if (tt === 'operation') M.opAncestors(tid).forEach(function (a) { st.expandedOps[a] = true; });
      if (tt === 'entity' || tt === 'position') {
        var holder = tt === 'position' ? M.get(tid).holder : tid;
        M.entAncestors(holder).forEach(function (a) { delete st.collapsedGroups[a]; });
      }
    });
    app.graph = AL.graph.build(M, st);
    // dependency path
    var di = app.graph.depInfo;
    if (di) {
      targets.forEach(function (tid) {
        var cur = tid, n = 0;
        while (di.parent[cur] && n++ < 50) { cur = di.parent[cur]; st.depExpanded[cur] = true; delete st.depCollapsed[cur]; }
      });
      app.graph = AL.graph.build(M, st);
    }
    var visible = targets.every(function (tid) { return app.graph.byId[tid] && !app.graph.byId[tid].hidden; }) || t === 'exit' && app.isVisible(id);
    if (!visible) {
      app.resetFilters({ silent: true });
      toast('Filters were reset so the item can be shown.');
    }
    app.refresh({ fit: !opts.keepView });
    var g = graphNodesFor(id);
    if (g.length) AL.render.centerOn(g[0]);
  };

  app.setView = function (v) {
    if (!AL.graph.VIEWS[v]) return;
    var was = app.state.view;
    app.state.view = v;
    app.refresh({ fit: true });
    renderTop();
    if (v === 'code' && was !== 'code') {
      var sel = app.state.selection;
      if (sel && sel.id && app.model.type(sel.id) === 'operation') app.openFunction(sel.id);
      else if (!document.querySelector('#code-body .src-view')) openFirstFile();
    }
  };

  app.resetFilters = function (opts) {
    var st = app.state, fresh = freshState(app.model, st);
    st.nodeTypes = fresh.nodeTypes;
    st.hiddenEdgeKinds = {}; st.hiddenBasis = {}; st.hiddenVerification = {};
    if (!(opts && opts.silent)) app.refresh({ fit: true });
  };

  app.toggleGroup = function (gid, collapsed) {
    if (collapsed === undefined) collapsed = !app.state.collapsedGroups[gid];
    if (collapsed) app.state.collapsedGroups[gid] = true; else delete app.state.collapsedGroups[gid];
    app.refresh({ anchor: gid });
  };

  app.toggleOp = function (oid) {
    if (app.state.expandedOps[oid]) {
      delete app.state.expandedOps[oid];
      app.model.opDescendants(oid).forEach(function (d) { delete app.state.expandedOps[d.id]; });
    } else app.state.expandedOps[oid] = true;
    app.refresh({ anchor: oid });
  };

  /** Restrict the Flows view to the root operation containing `oid` and expand it one level. */
  app.onlyOperation = function (oid) {
    var M = app.model, st = app.state;
    var anc = M.opAncestors(oid);
    var root = anc.length ? anc[0] : oid;
    st.opFilter = {};
    st.opFilter[root] = true;
    st.expandedOps[root] = true;
    anc.forEach(function (a) { st.expandedOps[a] = true; });
    if (st.view !== 'flows' && st.view !== 'all') st.view = 'flows';
    st.selection = { id: oid };
    app.refresh({ fit: true });
    renderTop();
  };

  app.applyTask = function (tid) {
    var M = app.model, t = M.get(tid);
    if (!t) return;
    var st = app.state;
    st.task = tid;
    if (t.view && AL.graph.VIEWS[t.view]) st.view = t.view;
    // reveal all focus items in that view
    (t.focus || []).forEach(function (f) {
      var tt = M.type(f);
      if (tt === 'operation') {
        M.opAncestors(f).forEach(function (a) { st.expandedOps[a] = true; });
        if (M.opChildren[f]) st.expandedOps[f] = true;
      }
    });
    st.depLimit = Infinity;
    var focus = [];
    (t.focus || []).forEach(function (f) {
      focus.push(f);
      var tt = M.type(f), x = M.get(f);
      if (tt === 'asset') (M.posByAsset[f] || []).forEach(function (p) { focus.push(p.id, p.holder); });
      if (tt === 'operation') {
        if (x.initiator) focus.push(x.initiator);
        M.opDescendants(f).forEach(function (d) { focus.push(d.id); });
        M.flowsUnder(f).forEach(function (fr) { if (fr.flow.from) focus.push(fr.flow.from); if (fr.flow.to) focus.push(fr.flow.to); });
      }
      if (tt === 'position') {
        focus.push(x.holder);
        (M.relFrom[f] || []).forEach(function (r) { if (r.kind === 'claim' || r.kind === 'depends_on' || r.kind === 'collateral' || r.kind === 'debt' || r.kind === 'exit') focus.push(r.target); });
      }
    });
    st.selection = t.focus && t.focus.length ? { id: t.focus[0] } : null;
    app.graph = AL.graph.build(M, st);
    var firstExit = (t.focus || []).filter(function (f) { return M.type(f) === 'exit'; })[0];
    st.focus = U.uniq(focus);
    st.focusExit = firstExit || null;
    app.refresh({ fit: true });
    renderTop();
    S.renderTasks(app);
  };

  app.showExit = function (xid) {
    var st = app.state;
    st.view = 'exits';
    st.selection = { id: xid };
    st.focus = [xid];
    st.focusExit = xid;
    app.refresh({ fit: true });
    renderTop();
  };

  app.showEvidence = function (evId) {
    AL.code.show(evId);
    U.$$('.ev-chip').forEach(function (c) { c.classList.toggle('active', c.dataset.ev === evId); });
  };

  // ---------------------------------------------------------------------------
  // import / export
  // ---------------------------------------------------------------------------
  function toast(msg, ms) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.hidden = true; }, ms || 3200);
  }
  app.toast = toast;

  function extractFromHTML(text) {
    var doc = new DOMParser().parseFromString(text, 'text/html');
    var el = doc.getElementById('fluxscope-data');
    if (!el) return null;
    try { return JSON.parse(el.textContent); } catch (e) { return null; }
  }

  /** Import a JSON (or exported HTML report) text. Returns true on success. */
  app.importText = function (text, name, source) {
    var data;
    text = String(text || '');
    var trimmed = text.replace(/^﻿/, '').trim();
    if (!trimmed) { S.showImportErrors(name, [{ path: '(file)', message: 'the file is empty' }]); return false; }
    if (trimmed[0] === '<') {
      var payload = extractFromHTML(trimmed);
      if (!payload || !payload.cases || !payload.cases.length) {
        S.showImportErrors(name, [{ path: '(file)', message: 'this HTML file does not contain FluxScope case data' }]);
        return false;
      }
      var okAny = false;
      payload.cases.forEach(function (c, i) { okAny = importData(c, name + (payload.cases.length > 1 ? ' #' + (i + 1) : ''), source || 'imported') || okAny; });
      return okAny;
    }
    try { data = JSON.parse(trimmed); } catch (e) {
      S.showImportErrors(name, [{ path: '(file)', message: 'not valid JSON: ' + e.message }]);
      return false;
    }
    return importData(data, name, source || 'imported');
  };

  function importData(data, name, source) {
    var res = AL.validate(data, app.schema);
    if (!res.ok) { S.showImportErrors(name, res.errors, res.warnings); return false; }
    var i = app.addCase(data, source, res.warnings);
    app.loadCase(i);
    toast('Loaded "' + (data.meta.title || data.meta.id) + '"' + (res.warnings.length ? ' with ' + U.plural(res.warnings.length, 'warning') : '') + '.');
    return true;
  }

  app.importFile = function (file) {
    var reader = new FileReader();
    reader.onload = function () { app.importText(reader.result, file.name, 'imported'); };
    reader.onerror = function () { S.showImportErrors(file.name, [{ path: '(file)', message: 'could not read the file' }]); };
    reader.readAsText(file);
  };

  app.exportJSON = function () {
    var c = app.cases[app.caseIndex];
    if (!c) return;
    U.download(U.safeFileName(c.data.meta.id) + '.json', JSON.stringify(c.data, null, 2) + '\n', 'application/json');
    toast('Exported ' + U.safeFileName(c.data.meta.id) + '.json');
  };

  app.buildReportHTML = function () {
    var c = app.cases[app.caseIndex];
    if (!c) return null;
    var doc = AL.pristine.cloneNode(true);
    var payload = { mode: 'report', cases: [c.data], default: c.data.meta.id, exported_at: new Date().toISOString(), exported_from: c.data.meta.title || c.data.meta.id };
    doc.querySelector('#fluxscope-data').textContent = U.embedJSON(payload);
    doc.querySelector('#fluxscope-config').textContent = U.embedJSON({ api: null });
    return '<!DOCTYPE html>\n' + doc.outerHTML + '\n';
  };

  app.exportHTML = function () {
    var c = app.cases[app.caseIndex];
    if (!c) return;
    var html = app.buildReportHTML();
    U.download(U.safeFileName(c.data.meta.id) + '.report.html', html, 'text/html');
    toast('Exported offline report ' + U.safeFileName(c.data.meta.id) + '.report.html');
  };

  // ---------------------------------------------------------------------------
  // wiring
  // ---------------------------------------------------------------------------
  var handlers = {
    onSelectNode: function (id) { app.select(id); },
    onSelectEdge: function (id) { app.selectEdge(id); },
    onBackground: function () { app.clearSelection(); },
    onHover: function (target) { if (app.state && app.state.view === 'code') AL.codeview.hoverGraph(target); },
    onHandle: function (hd) {
      var st = app.state;
      if (hd.action === 'expand-group') return app.toggleGroup(hd.target, false);
      if (hd.action === 'expand-op' || hd.action === 'collapse-op') return app.toggleOp(hd.target);
      if (hd.action === 'expand-dep') { st.depExpanded[hd.target] = true; delete st.depCollapsed[hd.target]; }
      if (hd.action === 'collapse-dep') { st.depCollapsed[hd.target] = true; delete st.depExpanded[hd.target]; }
      app.refresh({ anchor: hd.target });
    },
    onGroupTag: function (gid) { app.toggleGroup(gid, true); }
  };

  function wire() {
    U.$$('#view-switch button').forEach(function (b) { b.addEventListener('click', function () { app.setView(b.dataset.view); }); });
    document.getElementById('btn-export-json').addEventListener('click', app.exportJSON);
    document.getElementById('btn-export-html').addEventListener('click', app.exportHTML);
    document.getElementById('btn-fit').addEventListener('click', function () { AL.render.fit({ all: true }); });
    document.getElementById('btn-toggle-left').addEventListener('click', function () {
      var k = app.state && app.state.view === 'code' ? 'code' : 'graph';
      leftHidden[k] = !leftHidden[k];
      document.getElementById('main').classList.toggle('no-left', leftHidden[k]);
      setTimeout(function () { AL.render.fit(); }, 0);
    });
    document.getElementById('code-tools').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-code-mode], [data-pin], [data-unpin], [data-open-op]');
      if (!b) return;
      if (b.dataset.codeMode) app.setCodeMode(b.dataset.codeMode);
      else if (b.dataset.pin || b.dataset.unpin) app.togglePin(b.dataset.pin || b.dataset.unpin);
      else app.openFunction(b.dataset.openOp);
    });
    document.getElementById('layout-dir').addEventListener('change', function (ev) { app.state.dir = ev.target.value; app.refresh({ fit: true }); });
    document.getElementById('btn-zoom-in').addEventListener('click', function () { AL.render.zoomBy(1.25); });
    document.getElementById('btn-zoom-out').addEventListener('click', function () { AL.render.zoomBy(0.8); });
    document.getElementById('btn-depth-dec').addEventListener('click', function () {
      var st = app.state;
      st.depLimit = st.depLimit === Infinity ? 3 : Math.max(0, st.depLimit - 1);
      st.depExpanded = {}; st.depCollapsed = {};
      app.refresh({ fit: true });
    });
    document.getElementById('btn-depth-inc').addEventListener('click', function () {
      var st = app.state;
      st.depLimit = st.depLimit === Infinity ? Infinity : st.depLimit + 1;
      if (st.depLimit > 8) st.depLimit = Infinity;
      app.refresh({ fit: true });
    });
    document.getElementById('btn-expand-all').addEventListener('click', function () {
      var st = app.state, M = app.model;
      st.collapsedGroups = {};
      M.c.operation.forEach(function (o) { if (M.opChildren[o.id]) st.expandedOps[o.id] = true; });
      st.depLimit = Infinity; st.depExpanded = {}; st.depCollapsed = {};
      app.refresh({ fit: true });
    });
    document.getElementById('btn-collapse-all').addEventListener('click', function () {
      var st = app.state, M = app.model;
      st.expandedOps = {};
      st.collapsedGroups = {};
      M.c.entity.forEach(function (e) { if (M.entChildren[e.id] && !e.parent) st.collapsedGroups[e.id] = true; });
      st.depLimit = 1; st.depExpanded = {}; st.depCollapsed = {};
      app.refresh({ fit: true });
    });
    document.getElementById('related-mode').addEventListener('change', function (ev) { app.state.related = ev.target.value; applyHighlight(); });
    document.getElementById('label-mode').addEventListener('change', function (ev) { app.state.labels = ev.target.value; app.refresh({ fit: false }); });
    var fi = document.getElementById('file-input');
    fi.addEventListener('change', function () { if (fi.files && fi.files[0]) app.importFile(fi.files[0]); fi.value = ''; });
    document.getElementById('btn-paste').addEventListener('click', function () { S.showPaste(function (txt, name) { return app.importText(txt, name, 'pasted'); }); });
    var si = document.getElementById('search-input');
    si.addEventListener('input', U.debounce(function () { app.state.search = si.value.trim(); S.renderSearch(app); applyHighlight(); }, 120));
    si.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { var first = U.$('#search-results .search-item'); if (first) first.click(); }
      if (ev.key === 'Escape') { si.value = ''; app.state.search = ''; S.renderSearch(app); applyHighlight(); }
    });
    // delegated clicks for references, evidence, actions
    document.addEventListener('click', function (ev) {
      var t = ev.target.closest ? ev.target : null;
      if (!t || !app.model) return;
      var ref = t.closest('[data-ref]');
      var evb = t.closest('[data-ev]');
      var act = t.closest('[data-action]');
      var file = t.closest('[data-file]');
      if (act && act.tagName !== 'g' && act.dataset.target) {
        ev.preventDefault();
        var a = act.dataset.action, tg = act.dataset.target;
        if (a === 'show-exit') app.showExit(tg);
        else if (a === 'reveal') app.reveal(tg);
        else if (a === 'toggle-group') app.toggleGroup(tg);
        else if (a === 'toggle-op') app.toggleOp(tg);
        else if (a === 'only-op') app.onlyOperation(tg);
        else if (a === 'all-ops') { app.state.opFilter = null; app.refresh({ fit: true }); }
        else if (a === 'open-code') app.openFunction(tg);
        else if (a === 'open-def') { if (!AL.codeview.openDef(tg)) app.toast('The source of this function is not embedded.'); }
        else if (a === 'toggle-pin') { app.togglePin(tg); renderDetails(); }
        return;
      }
      if (evb) { ev.preventDefault(); app.showEvidence(evb.dataset.ev); return; }
      if (file && file.classList.contains('ref')) { AL.code.showFile(file.dataset.file); return; }
      if (ref && !t.closest('#graph')) {
        ev.preventDefault();
        var id = ref.dataset.ref;
        var M = app.model;
        if (!M.get(id)) { toast('"' + id + '" is not part of this result.'); return; }
        if (M.type(id) === 'unresolved') {
          app.state.selection = { id: id };
          app.state.focus = (M.get(id).subjects || []).slice();
          app.state.focusExit = null;
          applyHighlight(); renderDetails();
          return;
        }
        app.select(id, { reveal: true });
      }
    });
    U.$$('.side-section.collapsible h3').forEach(function (hd) {
      hd.addEventListener('click', function () { hd.parentElement.classList.toggle('folded'); });
    });
    ['sec-filters', 'sec-groups', 'sec-scope'].forEach(function (id) { document.getElementById(id).classList.add('folded'); });
    // drag & drop
    var overlay = document.getElementById('drop-overlay'), depth = 0;
    window.addEventListener('dragenter', function (ev) { if (hasFiles(ev)) { depth++; overlay.hidden = false; ev.preventDefault(); } });
    window.addEventListener('dragleave', function () { depth = Math.max(0, depth - 1); if (!depth) overlay.hidden = true; });
    window.addEventListener('dragover', function (ev) { if (hasFiles(ev)) ev.preventDefault(); });
    window.addEventListener('drop', function (ev) {
      depth = 0; overlay.hidden = true;
      if (!hasFiles(ev)) return;
      ev.preventDefault();
      var f = ev.dataTransfer.files[0];
      if (f) app.importFile(f);
    });
    window.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && !document.querySelector('.modal')) app.clearSelection();
      if (ev.key === '/' && document.activeElement && ['INPUT', 'TEXTAREA', 'SELECT'].indexOf(document.activeElement.tagName) < 0) { ev.preventDefault(); si.focus(); }
    });
    window.addEventListener('resize', U.debounce(function () { if (app.graph) AL.render.fit(); }, 200));
  }
  function hasFiles(ev) { return ev.dataTransfer && Array.prototype.indexOf.call(ev.dataTransfer.types || [], 'Files') >= 0; }

  // ---------------------------------------------------------------------------
  // boot
  // ---------------------------------------------------------------------------
  function boot() {
    app.schema = U.readJSONScript('fluxscope-schema');
    app.config = U.readJSONScript('fluxscope-config') || { api: null };
    var payload = U.readJSONScript('fluxscope-data') || { mode: 'app', cases: [] };
    app.mode = payload.mode || 'app';
    AL.render.init(document.getElementById('graph'), handlers);
    AL.code.init();
    AL.codeview.init();
    wire();
    S.renderAnalyze(app);
    var src = app.mode === 'report' ? 'report' : 'built-in';
    var problems = [];
    (payload.cases || []).forEach(function (d) {
      var res = AL.validate(d, app.schema);
      if (res.ok) app.addCase(d, src, res.warnings);
      else problems.push({ name: (d && d.meta && (d.meta.title || d.meta.id)) || 'embedded case', res: res });
    });
    if (app.mode === 'report') {
      var rb = document.getElementById('report-banner');
      rb.hidden = false;
      rb.innerHTML = '<b>Offline report</b> · exported ' + U.esc(payload.exported_at ? payload.exported_at.replace('T', ' ').slice(0, 19) + ' UTC' : '') +
        (payload.exported_from ? ' from “' + U.esc(payload.exported_from) + '”' : '') +
        ' · contains the analysis data and embedded evidence; no network access is needed.';
    }
    if (app.cases.length) {
      var idx = 0;
      if (payload.default) app.cases.forEach(function (c, i) { if (c.data.meta.id === payload.default) idx = i; });
      app.loadCase(idx);
    } else {
      renderEmpty();
      S.renderCases(app);
    }
    if (problems.length) S.showImportErrors(problems[0].name, problems[0].res.errors, problems[0].res.warnings);
    document.documentElement.setAttribute('data-fluxscope-ready', '1');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
