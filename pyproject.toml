[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxscope"
version = "0.1.0"
description = "Recover and visualise DeFi asset flows, holdings and exit paths with evidence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "slither-analyzer>=0.11",
  "crytic-compile>=0.3",
  "pydantic>=2.7",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
llm = ["openai>=1.40", "anthropic>=0.40"]
test = ["pytest>=8", "httpx>=0.27", "playwright>=1.44"]

[project.scripts]
fluxscope = "fluxscope.cli:main"

[tool.setuptools.packages.find]
include = ["fluxscope*"]

[tool.setuptools.package-data]
fluxscope = ["static/*.html", "llm/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: compiles real projects with Slither",
  "e2e: drives the HTML viewer in a headless browser",
  "llm: calls a live language model API",
]
